<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule Rebuild Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">

<link rel="stylesheet" href="../app-jwg-theme.css">

<style>body{margin:0;background:#f7f9f8}#view-jwgscheduler{display:block!important}</style>
</head>
<body>
<div id="view-jwgscheduler" class="view active">
  <div id="header"><div class="logo"><div class="logo-words"><div class="logo-text">Jeff White Group</div><div class="logo-sub">Staff Scheduler · PREVIEW (sample data, saves nothing)</div></div></div>
    <span class="emp-badge" id="empCount">0 employees</span></div>
  <div id="jwg-toast"></div>
  <div id="app"></div>
</div>
<script>
// Stand-in database: sample crew, nothing leaves the page.
window.SUPABASE_URL="https://preview.invalid";window.SUPABASE_KEY="preview";
function wedStr(){var n=new Date(),d=n.getDay(),r=new Date(n);r.setDate(n.getDate()-d+(d===0?-6:1)+2);return r.getFullYear()+"-"+String(r.getMonth()+1).padStart(2,"0")+"-"+String(r.getDate()).padStart(2,"0");}
var TABLES={crew_members:[{id:"cm1",name:"Tyler C"}],jobs:[{service:"Junk Removal",junk_date:wedStr(),date:wedStr(),junk_time:"09:00",time:"09:00",est_duration_min:120,assigned_crew_ids:["cm1"],status:"Booked",city:"Barrie",address:"12 Example St"}]};
function chain(table){var p=new Proxy(function(){},{get:function(_,k){if(k==="then")return function(a,b){return Promise.resolve({data:TABLES[table]||[],error:null}).then(a,b);};if(k==="catch")return function(){return p;};return function(){return p;};},apply:function(){return p;}});return p;}
var db={auth:{getSession:function(){return Promise.resolve({data:{session:null}});}},from:function(t){return chain(t);},channel:function(){return chain();},removeChannel:function(){}};
var GREY="#64748b";
function tc(hex){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{bg:"rgba("+r+","+g+","+b+",0.12)",text:"rgb("+Math.round(r*.55)+","+Math.round(g*.55)+","+Math.round(b*.55)+")",dot:hex};}
function T(id,label,hex,x){return Object.assign({id:id,label:label},tc(hex),x||{});}
var TASKS=[T("off","Day off",GREY,{builtIn:true,away:true}),T("sick","Sick",GREY,{builtIn:true,away:true}),T("nowork","No work",GREY,{builtIn:true,away:true}),
  T("bins","Bins","#22c55e"),T("junk","Junk Removals","#ca8a04"),T("furniture","Furniture Bank","#ff0000"),T("garbage","Garbage","#8000ff"),T("shop","Shop","#eab308"),
  T("office","Office","#0d9488"),T("quote","Quote","#0000ff"),T("snow","Snow","#0ea5e9"),T("cut","Cutting Crew","#1a7a3c"),T("garden","Garden Crew","#e010b3"),
  T("meet","Staff Meeting","#ad29c7"),T("vac","Vacation",GREY,{away:true}),T("closed","Office closed",GREY,{away:true}),T("personal","Personal",GREY,{away:true}),
  T("appt","Appointment",GREY,{away:true}),T("bday","Birthday","#f47c0b"),T("land","Landscape/Extra","#1a4c7a")];
var PEOPLE=[["jeff","Jeff White","Owners",0],["barb","Barbara White","Owners",0],["sam","Sam","Office admin",1],["kelly","Kelly","Office admin",0],["rachel","Rachel","Office admin",0],
  ["josh","Josh","Misc jobs",1],["jordan","Jordan","Misc jobs",0],["max","Max","Misc jobs",0],["tylerm","Tyler M","Misc jobs",0],
  ["darrin","Darrin","Cutting crew",0],["jasper","Jasper","Cutting crew",0],["tylerc","Tyler C","Cutting crew",0],["micaela","Micaela","Garden crew",0],
  ["kevin","Kevin","Bins",0],["neil","Neil","Bins",0],["jake","Jake","IT",0]];
function J(t,s,e){return{tasks:[t],start:s,end:e};}
function W(){return{status:"work",shifts:[].slice.call(arguments)};}
var O=J("office","8:30","16:30"),Tt=J("office","10:00","16:00"),JK=J("junk","7:00","16:00"),C=J("cut","7:00","16:00"),B=J("bins","7:00","17:00"),SH=J("shop","7:00","15:30"),G=J("garden","7:00","16:00");
var OFF={status:"off",shifts:[]};
var WEEK={
  jeff:[W(Tt),OFF,W(Tt),OFF,W(Tt)], barb:[W(O),W(O),W(O),W(O),{status:"dayoff",shifts:[]}],
  sam:[W(O),W(O),W(O),W(O),W(O)], kelly:[W(O),W(O),{status:"work",shifts:[{tasks:["appt"],start:"10:00",end:"15:00"}]},W(O),W(O)],
  rachel:[W(Tt),W(Tt),OFF,W(Tt),{status:"work",shifts:[{tasks:["vac"],start:"7:00",end:"19:00"}]}],
  josh:[W(JK),W(JK),W(JK),W(JK),W(JK)], jordan:[W(JK),W(JK),W(J("furniture","8:00","16:00")),W(JK),OFF],
  max:[W(J("furniture","8:00","16:00")),W(JK),W(JK),W(JK),{status:"sick",shifts:[]}], tylerm:[W(SH),W(SH),W(SH),W(J("land","7:00","16:00")),W(J("land","7:00","16:00"))],
  darrin:[W(C),W(C),W(C),W(C),W(SH)], jasper:[W(C),W(C),W(C),W(C),W(C)],
  tylerc:[W(C),W(C),OFF,W(C),W(C)], micaela:[W(G),W(G),{status:"nonworking",shifts:[]},W(G),W(G)],
  kevin:[W(B),W(B),W(B),W(B),W(B)], neil:[W(B),W(B),W(B),W(B),{status:"dayoff",shifts:[]}],
  jake:[OFF,{status:"work",shifts:[J("office","8:00","12:00"),{tasks:["appt"],start:"13:00",end:"15:00"}]},OFF,W(Tt),OFF]
};
var DN=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function mon(){var n=new Date(),d=n.getDay(),r=new Date(n);r.setDate(n.getDate()-d+(d===0?-6:1));return r.getFullYear()+"-"+String(r.getMonth()+1).padStart(2,"0")+"-"+String(r.getDate()).padStart(2,"0");}
var SCHEDS=PEOPLE.map(function(p){var sd={};DN.forEach(function(d,i){sd[d]=WEEK[p[0]][i]||{status:"off",shifts:[]};});return{employee_id:p[0],week_start:mon(),schedule_data:sd};});
window._posts=[];
window.fetch=function(url,opts){
  var path=String(url).replace(/^.*\/rest\/v1\//,"").split("?")[0],m=(opts&&opts.method)||"GET",body=null;
  if(m!=="GET"){window._posts.push({path:path,method:m,body:opts.body?JSON.parse(opts.body):null});body=[];}
  else if(path==="jwg_app_settings")body=[{key:"tasks",value:TASKS},{key:"wh",value:{start:7,end:19}}];
  else if(path==="jwg_employees")body=PEOPLE.map(function(p){return{id:p[0],name:p[1],usual_week:null,repeats_weekly:false};});
  else if(path==="jwg_schedules")body=SCHEDS;
  else if(path==="crew_members")body=PEOPLE.map(function(p){return{jwg_id:p[0],active:true,on_jwg:true,crew_group:p[2],is_manager:!!p[3]};});
  else body=[];
  return Promise.resolve({ok:true,status:200,json:function(){return Promise.resolve(body);},text:function(){return Promise.resolve(JSON.stringify(body));}});
};
try{localStorage.removeItem("ss_tasks");}catch(e){}
</script>
<script src="../jwg-icons.js"></script>
<script src="../app-jwg-scheduler.js"></script>
<script src="../app-jwg-feed.js"></script>
<script>renderJwgScheduler();</script>
</body>
</html>
