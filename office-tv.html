      };
      o.setContent = function(h){ o.__html = h; if(o.__div){ o.__div.innerHTML = h; o.draw(); } };
      o.setPosition = function(ll){ o.__ll = ll; o.draw(); };
      o.setMap(_map);
      return o;
    }

    function ensureTruckMap(){
      if(_map) return _map;
      if(typeof google === 'undefined' || !google.maps) return null;
      var host = el('tvmap');
      if(!host) return null;
      // Blanked before it exists and held there until Google says the opening view
      // is drawn (below). The ground colour stops the white flash; this stops the
      // empty dark box popping into a full map in a single frame.
      host.classList.add('cut');
      // Fully inert — it's a wall, there's nobody to pan or zoom it.
      _map = new google.maps.Map(host, {
        center:{ lat:YARD.lat, lng:YARD.lng }, zoom:10,
        disableDefaultUI:true, gestureHandling:'none', keyboardShortcuts:false,
        clickableIcons:false,
        // Satellite imagery with roads and place names over it. A drawn map never
        // looked like the photograph the rest of the board is built on; this is
        // the same kind of picture, and it is aligned to the metre for free.
        // MAP_STYLE is kept below but is INERT while this is 'hybrid' - Google
        // does not let styles touch imagery at all.
        mapTypeId:'hybrid', styles:MAP_STYLE,
        // Google paints its own ground under the tiles while they load, and its
        // default is near-white — so building the map flashed white across a dark
        // board. This is the panel's own ground (#tvmap in the CSS), so there is
        // nothing to see until the imagery lands. Construction-only: Google offers
        // no setter for it afterwards.
        backgroundColor:'#36432f',
        // A styled map is a raster map, and raster maps round the zoom down to a
        // whole number — so an overview that really wanted 10.8 was drawn at 10,
        // a good bit wider than the trucks needed. Fractional zoom lets the fit
        // land where it actually belongs, which is the whole point of the
        // all-trucks view: as close as it can get with everyone still on screen.
        isFractionalZoomEnabled:true
      });
      // Live traffic. It is a layer over the map that is already loaded, so it
      // costs nothing on top of the map load — and it is the one thing here that
      // tells the office something they could not already see.
      new google.maps.TrafficLayer().setMap(_map);
      // Creating the map is the ONE thing Google bills, so this is counted here and
      // nowhere else — every pan, zoom and truck hop after this is free and must not
      // be tallied, or the Usage page would invent traffic that was never charged.
      // Same table the address autocomplete writes to, so both show on one page.
      // Fire-and-forget: a counter that failed must never stop the map drawing.
      db.rpc('bump_google_api', { p_api:'maps_dynamic' }).then(function(r){
        if(r.error) console.warn('map load not counted', r.error.message);
      });
      // A bare landmark dot, no label. A text chip here collides constantly —
      // Barrie sits right on top of the yard, and truck labels hang down into it.
      // How many trucks are parked here needs no chip either: "5 of 6 out" says it.
      htmlMarker(new google.maps.LatLng(YARD.lat, YARD.lng), '<div class="lo-yard"></div>', 'lo-mk-yard');
      // First 'idle' is Google saying the opening view is actually drawn. Until then
      // _mapReady keeps revealMap shut, so an early cutTo during boot cannot uncover
      // a half-built map; after it, the panel fades up.
      google.maps.event.addListenerOnce(_map, 'idle', function(){
        _mapReady = true;
        revealMap();
      });
      // The same guard frameAll keeps: if 'idle' never arrives the panel must not sit
      // black on the wall all evening. Longer than frameAll's 900 ms because this one
      // waits on the first tile fetch of the night, not a re-frame of tiles in hand.
      setTimeout(function(){ _mapReady = true; revealMap(); }, 4000);
      return _map;
    }

    // Runs once the Maps library is in. The board boots long before the Live Ops
    // panel comes round, so normally the map is ready and waiting — but if the
    // panel is already up when this lands, draw into it straight away.
    window.__onGmaps = function(){
      if(PANELS[panelIdx] === 'liveops'){ drawTrucks(); startCycle(); }
    };
    if(window.__gmapsReady.done) window.__onGmaps();

    // Only trucks that are actually OUT get a pin — the yarded ones would all land
    // on the same pixel. This is also what the "N of M out" tag counts.
    function outTrucks(){
      return (DATA.trucks || []).filter(function(t){ return truckState(t) !== 'yard'; });
    }

    // A truck that hasn't moved all trail-window (90 min, under 50 m of travel =
    // no trail) is parked — shop, yard, wherever — and the highlight walk skips it
    // (Jake 2026-07-20). It keeps its pin; it just doesn't get lit up.
    //
    // This is the ONLY thing trail data is still read for. Nothing draws it since
    // 2026-09-09, but current status alone cannot tell a working truck from a
    // parked one — a truck at a red light reads 'stopped' too.
    //
    // Two guards keep this honest:
    // - moving RIGHT NOW is always walked, even with no trail yet — covers a truck
    //   that woke up inside the 5-min trail cache window.
    // - stale/absent trail data disarms the skip entirely — on a Geotab blip the
    //   whole fleet would otherwise look asleep and the walk would stop.
    function isParked(t){
      if(!DATA.trailsAt || Date.now() - DATA.trailsAt > 15 * 60000) return false;
      if(truckState(t) === 'moving') return false;
      return !(DATA.trails || {})[t.id];
    }
    function tourTrucks(){
      return outTrucks().filter(function(t){ return !isParked(t); });
    }

    // The mockup's marker: glossed disc, white ring, name chip, and a ping ring
    // while the truck is moving. `sel` is the truck the map is focused on.
    function truckIcon(t, sel){
      var st = truckState(t), c = TRUCK_C[st];
      var gloss = 'radial-gradient(circle at 34% 28%, color-mix(in srgb, '+c+' 55%, #fff), '+c+')';
      var ping = st === 'moving' ? '<span class="ping" style="color:'+c+'"></span>' : '';
      // The disc sizes itself off .lo-tk / .lo-tk.sel in CSS, so there is no pixel
      // size to declare here the way a Leaflet icon needed one.
      return '<div class="lo-tk'+(sel ? ' sel' : '')+'">'
           + '<span class="b" style="background:'+gloss+'; --glyph:'+TRUCK_GLYPH[st]+'">'
           +   TRUCK_SVG+ping+'</span>'
           + '<span class="n">'+esc(t.name)+(driverFor(t) ? ' &middot; '+esc(driverFor(t)) : '')+'</span></div>';
    }

    // Each truck's regular driver — the same pairing app-leaderboard.js encodes as
    // AUTO_ASSIGNMENTS, and what Jake confirms: Kevin is always in the L7, Neil in
    // Hino 2020.
    //
    // Deliberately NOT vehicle_assignments. That table is the crew ROSTER on a truck
    // (UNIQUE(vid, crew_member_id, assignment_date); toggleCrewAssignment inserts one
    // row per person), so a driver and their helper sit there as concurrent open rows
    // — on 2026-07-07 the L7 held Kevin 08:07 and Josh 11:24 at once. Picking the
    // latest row therefore names the HELPER, and since bin legs carry only the
    // driver's crew id, their jobs-left reads 0 while the truck still has a full run.
    // Darrin's truck is his and always will be. Every other pairing that used to
    // sit here was a guess that outlived its truth — Neil is not always on the
    // 2020, and on 2026-09-04 he never left the yard while Max ran his stops.
    // A truck the day has not shown us yet simply has no name on it.
    var TRUCK_DRIVERS = [
      { match:'Darrin Truck', driver:'Darrin' }
    ];
    // Today's GPS evidence first (buildTruckDrivers), the regular pairing until there is any.
    // Which trucks earn a card on the right. A truck that has not moved inside
    // the trail window, or has not reported for hours, is parked somewhere and
    // was taking a slot from a truck that is actually out - the Hino 2020 sat on
    // the rail all morning having last reported at 5pm the day before.
    //
    // Order is deliberately STABLE rather than clever: sorting by moving-first
    // would reshuffle the rail every time a truck stopped at a light, which on a
    // wall reads as flicker. Bin trucks lead in name order and the shop truck
    // sits last, because the bins are the day's work and Darrin's truck carries
    // no bin legs.
    // A truck sitting overnight is not today's news. Twelve hours is Jake's line:
    // long enough that a truck parked up mid-afternoon still holds its card for the
    // rest of the day, short enough that yesterday's last ping never shows up on
    // this morning's rail - which is the case that started this (the Hino 2020 sat
    // there all morning having last reported at 5pm the day before).
    var RAIL_STALE_MS = 12 * 60 * 60 * 1000;
    // The whole fleet, so nothing is ever silently dropped. Six used to be the cap
    // because six was what fitted at a readable size in the rail's 728px - but now
    // that stopped and parked trucks get a card too, six could quietly hide two of
    // the eight vehicles, and a truck missing from the wall is worse than a shorter
    // card. The rail sizes itself to however many there are (see #loRail): up to six
    // they keep exactly the height they always had, and only a rare full-fleet day
    // shrinks them to fit. The shop truck still sorts last.
    var RAIL_MAX = 8;
    function isShopTruck(t){
      return /darrin/i.test(String(t.name || '')) || driverFor(t) === 'Darrin';
    }
    function railTrucks(list){
      return (list || []).filter(function(t){
        if(truckState(t) === 'yard') return false;
        // Stopped and parked trucks DO get a card now (Jake, 2026-09-09) - the rail
        // has the room, and a truck standing at a job for an hour is exactly the one
        // the office is asking about. It is still only a card: the highlight walk
        // skips parked trucks, because the ring means "this is the one the board is
        // talking about" and a truck that has not moved in 90 minutes has nothing to
        // say. The yard is still excluded - those are not out - and so is anything
        // that has not reported inside RAIL_STALE_MS, which is yesterday's news.
        var age = t.lastUpdate ? Date.now() - Date.parse(t.lastUpdate) : 0;
        return age <= RAIL_STALE_MS;
      }).sort(function(a, b){
        var sa = isShopTruck(a) ? 1 : 0, sb = isShopTruck(b) ? 1 : 0;
        if(sa !== sb) return sa - sb;
        return String(a.name).localeCompare(String(b.name));
      }).slice(0, RAIL_MAX);
    }

    function driverFor(t){
      var seen = (DATA.truckDriver || {})[t.id];
      if(seen) return seen;
      var name = String(t.name || ''), hit = null;
      TRUCK_DRIVERS.forEach(function(d){ if(!hit && name.indexOf(d.match) >= 0) hit = d.driver; });
      return hit;
    }
    function crewIdByName(name){
      var want = String(name || '').toLowerCase(), hit = null;
      Object.keys(DATA.crewAll || {}).forEach(function(id){
        if(!hit && String(DATA.crewAll[id]).toLowerCase() === want) hit = id;
      });
      return hit;
    }

    // Today's work still outstanding for one crew member. Bin legs come from the
    // board (done/not-done is geofence-driven, same as Screen 1); everything else
    // counts as left until the job is marked completed.
    function crewProgress(crewId){
      var done = 0, total = 0;
      (DATA.binBoard||[]).forEach(function(g){
        if(g.crewId !== crewId) return;
        g.legs.forEach(function(l){ total++; if(l.done) done++; });
      });
      (DATA.jobs||[]).forEach(function(e){
        if(e.service === 'Bin Drop-off' || e.service === 'Bin Pick-up') return;   // counted above
        if((e.crewIds||[]).indexOf(crewId) === -1) return;
        total++; if(e.completed) done++;
      });
      return { done:done, total:total, left:total-done };
    }

    // Card for the focused truck. A permanent tooltip so it tracks the pin rather
    // than needing a hover the wall can never give it. Driver and jobs-left only
    // appear when today's truck assignment tells us who is actually in it.
    // One card per truck for the right-hand rail. Compact on purpose: every truck
    // is on screen at once now, so each gets a fifth of the height rather than a
    // popup's worth. Driver leads, because that is who the office asks about.
    function truckCard(t){
      var st = truckState(t), c = TRUCK_C[st];
      var label = TRUCK_LABEL[st];
      // Against Date.now(), NOT DATA.trucksAt: both of those are stamped at fetch
      // time, so the age froze and read "just now" for a whole weekend while the
      // pins were Saturday's. An "ago" label has to keep counting.
      var age = t.lastUpdate
        ? Math.max(0, Math.round((Date.now() - Date.parse(t.lastUpdate)) / 60000)) : null;
      var driver = driverFor(t);
      var crewId = driver ? crewIdByName(driver) : null;
      var rows = '';
      // The truck's own name only needs a line of its own when the driver is the title.
      rows += driver
        ? '<div class="rw"><span>' + esc(t.name) + '</span><b>' + Math.round(t.speed || 0) + ' km/h</b></div>'
        : '<div class="rw"><span>Speed</span><b>' + Math.round(t.speed || 0) + ' km/h</b></div>';
      // Jobs only when there is work to measure - a 0 of 0 reads as "finished" when
      // it means "nothing was assigned", and Darrin's truck carries no bin legs.
      var pr = crewId ? crewProgress(crewId) : null;
      if(pr && pr.total){
        rows += '<div class="rw"><span>' + pr.done + ' of ' + pr.total + ' done</span>'
             +  '<b>' + pr.left + ' left</b></div>';
      }
      // Only when it is worth reading. A truck pinging normally says nothing by
      // saying "1 min ago", and that row was the third line on every card - which
      // is what stopped six of them fitting legibly. Stale is the case the office
      // needs to see, so stale is the case that gets the space.
      if(age === null || age >= 5){
        rows += '<div class="rw sm"><span>Last ping</span><b>'
             +  (age === null ? '\u2014' : age + ' min ago') + '</b></div>';
      }
      return '<div class="card" data-tid="' + esc(t.id) + '">'
        + '<div class="hd" style="background:' + c + '">'
        + '<span class="nm">' + esc(driver || t.name) + '</span>'
        + '<span class="st">' + label + '</span></div>'
        + '<div class="bd">' + rows + '</div></div>';
    }

    function drawTrucks(){
      var map = ensureTruckMap();
      if(!map) return;
      var list = outTrucks(), seen = {};
      list.forEach(function(t){
        seen[t.id] = 1;
        var m = _markers[t.id];
        if(m){
          m.setPosition(new google.maps.LatLng(t.lat, t.lng));
          m.setContent(truckIcon(t, t.id === _focusId));
        } else {
          _markers[t.id] = htmlMarker(new google.maps.LatLng(t.lat, t.lng), truckIcon(t, false), 'lo-mk-truck');
        }
      });
      Object.keys(_markers).forEach(function(id){
        if(!seen[id]){ _markers[id].setMap(null); delete _markers[id]; }
      });
      // The panel is hidden when the map is first built, so the map needs a nudge
      // to pick up its real size — otherwise it renders against a zero-width box
      // and comes back blank. Re-centring after is what actually puts it right.
      google.maps.event.trigger(map, 'resize');
      drawJobPins();
    }

    // Today's work, pinned by TOWN rather than address. Two reasons, and both are
    // deliberate: the board frames the whole service area, where two addresses in
    // the same town land on the same pixel — and jobs carry no coordinates, only an
    // address the wall must never hand to a geocoder (see the note above TOWNS).
    // The town a job already names is enough to say where the day's work is.
    var TOWN_LL = {};
    TOWNS.forEach(function(t){ TOWN_LL[t[0].toLowerCase()] = t; });

    function townOf(city){
      if(!city) return null;
      // "Barrie, ON" and "barrie " both have to find Barrie.
      return TOWN_LL[String(city).toLowerCase().replace(/,.*$/, '').trim()] || null;
    }

    // A town's chip for one kind of stop: how many are LEFT, or a tick once they
    // are all done. Nothing is drawn for a kind the town has none of, so a town
    // with only bins shows only bins.
    function stopChip(cls, c){
      if(!c.total) return '';
      var left = c.total - c.done;
      return '<div class="'+cls+(left ? '' : ' done')+'">'+(left || '✓')+'</div>';
    }

    function drawJobPins(){
      if(!_map) return;
      var by = {}, missed = {};
      (DATA.jobs || []).forEach(function(j){
        var t = townOf(j.city);
        if(!t){ if(j.city) missed[j.city] = 1; return; }
        var g = by[t[0]] || (by[t[0]] = { town:t, job:{total:0,done:0},
                                          drop:{total:0,done:0}, pick:{total:0,done:0} });
        var c = g[j.kind || 'job'];
        c.total++;
        if(j.completed) c.done++;
      });
      // A town we cannot place is silently missing from the wall, which looks like a
      // quiet day rather than a gap. Name them once so the list can be extended.
      var miss = Object.keys(missed);
      if(miss.length) console.warn('job pins: no town match for', miss.join(', '));

      Object.keys(by).forEach(function(name){
        var g = by[name];
        // One marker per town carrying up to three chips side by side — work, bins
        // going out, bins coming back. One marker rather than three because they all
        // sit on the same town coordinate: three separate markers would land on the
        // same pixel and cover each other.
        var html = stopChip('lo-job', g.job)
                 + stopChip('lo-bin drop', g.drop)
                 + stopChip('lo-bin pick', g.pick);
        if(_jobMarkers[name]) _jobMarkers[name].setContent(html);
        else _jobMarkers[name] = htmlMarker(
          new google.maps.LatLng(g.town[1], g.town[2]), html, 'lo-mk-job');
      });
      Object.keys(_jobMarkers).forEach(function(name){
        if(!by[name]){ _jobMarkers[name].setMap(null); delete _jobMarkers[name]; }
      });
    }

    // Frame everything — the overview we fall back to when there's nobody to focus.
    // Move the map somewhere it cannot glide to. Blank the panel first so the
    // jump happens unseen, then let it fade back up. Synchronous on purpose —
    // deferring the move with a timer would let the next tour step overtake it.
    // Every uncovering of the map goes through here, so the hold from creation
    // (ensureTruckMap) is honoured by all of them — before the first 'idle' this
    // does nothing and the panel stays blanked.
    // Two frames: one for the browser to paint the blanked panel, one to drop the
    // class so the transition actually runs instead of being collapsed.
    function revealMap(){
      var host = el('tvmap');
      if(!host || !_mapReady) return;
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ host.classList.remove('cut'); });
      });
    }

    function cutTo(move){
      var host = el('tvmap');
      if(!host){ move(); return; }
      host.classList.add('cut');
      try {
        move();
      } finally {
        // finally, not catch: a real error still propagates to the console, but a
        // throw can never strand the panel black on the wall for the evening.
        revealMap();
      }
    }

    // The overview. Framed on the trucks THEMSELVES, as tight as they allow —
    // a fixed zoom either buries a tight cluster in empty countryside or pushes
    // a spread-out crew off the edges. The yard is deliberately not forced into
    // the bounds: with everyone up in Muskoka it would drag Barrie into frame
    // and spend half the screen on fields nobody is working in.
    function frameAll(){
      if(!_map) return;
      // Frame the trucks that are actually WORKING, not merely away from the yard.
      // A truck parked somewhere else overnight still reads as out — the Hino 2020
      // sat 5.3 km from the shop, untouched since the evening before — and framing
      // it pulled the map wide off the crew every single day. isParked already
      // knows the difference (no trail in the last 90 minutes), so use it. If every
      // truck is idle there is nothing to choose between them and they all frame.
      var out = tourTrucks();
      if(!out.length) out = outTrucks();
      if(!out.length){
        // Nobody out, so there are no pins and nothing to frame — sit on the yard
        // at the width the board always used for this. Deliberately unchanged:
        // an empty map reads the same at any zoom, and widening it here would be
        // the opposite of what the rest of this change is for.
        cutTo(function(){
          _map.setZoom(12);
          _map.setCenter(new google.maps.LatLng(YARD.lat, YARD.lng));
        });
        return;
      }
      var b = new google.maps.LatLngBounds();
      out.forEach(function(t){ b.extend(new google.maps.LatLng(t.lat, t.lng)); });
      // Frame the MOMENT, not the day. This used to stretch the bounds over every
      // truck's whole 90-minute path as well, because the overview replayed those
      // paths and half a run would otherwise have been drawn off-screen. The paths
      // are gone (Jake, 2026-09-09) and so is the reason: framing where the trucks
      // ARE is both the question the office is asking and a far tighter frame — a
      // truck that ran to Midland and came back no longer drags Midland into shot.
      // Blanked across BOTH moves, not just the first. fitBounds settles a frame
      // or two later, and the clamp below can then change the zoom again — reveal
      // after the first and you would watch it jump a second time.
      var host = el('tvmap');
      if(host) host.classList.add('cut');
      var shown = false;
      function reveal(){
        if(shown || !host) return;
        shown = true;
        revealMap();
      }
      // The map is the whole board now, so most of its edges are behind something:
      // the truck rail down the right, the header scrim and town chip above, and
      // the footer bar below. Measured on the real board: rail x1560-1880, town
      // chip y206-262, footer from y958. The padding has to clear ALL of them -
      // an earlier pass cleared only the rail, so trucks still hid behind the
      // chip top-left and the key bottom-left. The key has since moved onto the
      // footer, which is why nothing extra is reserved for it down there.
      _map.fitBounds(b, { top:272, right:380, bottom:150, left:64 });
      // fitBounds takes no maxZoom, and one truck out collapses the bounds to a
      // point, which would slam the map to rooftop level. THAT is the only case
      // worth clamping. Capping at the old fixed tour zoom of 13 was wrong and made
      // this look like a fixed zoom: 13 covers about 24 km, a crew working one town
      // is inside five, so the clamp fired every time and left the pins bunched in
      // the middle of an empty map. 16 is roughly a 3 km view — close enough to read
      // the streets, wide enough that a tight cluster still has context.
      google.maps.event.addListenerOnce(_map, 'idle', function(){
        if(_map.getZoom() > MAX_FRAME_ZOOM) _map.setZoom(MAX_FRAME_ZOOM);
        reveal();
      });
      // 'idle' is the normal path; this only matters if it never arrives, and a
      // map panel left black on a wall all evening is not a failure worth risking.
      setTimeout(reveal, 900);
    }

    // ── focus cycle: light up each truck in turn, camera stays put ────────
    // What used to be a tour of the fleet is now a walk of the HIGHLIGHT. The map
    // holds one frame with everyone on it (frameAll) and does not move again while
    // the screen is up; all that changes is which pin is enlarged, which rail card
    // is lit, and which town the chip names. See the note by HIGHLIGHT_MIN_MS for why.
    function stopCycle(){
      _cycleGen++;                       // any chain still in flight now bails out
      clearTimeout(_cycleTimer); _cycleTimer = null;
      unfocus();
      el('loTown').classList.remove('on');
      highlightRail(null);
    }

    function highlightRail(id){
      var rail = el('loRail');
      if(!rail) return;
      [].forEach.call(rail.children, function(c){
        c.classList.toggle('on', !!id && c.getAttribute('data-tid') === id);
      });
    }

    // Shrink the currently-highlighted pin back to normal and forget it. Only that
    // one marker is rebuilt: re-iconing the whole fleet threw away and rebuilt every
    // marker's DOM for nothing, which is why this has always been done a pin at a
    // time. Safe to call when nothing is highlighted.
    function unfocus(){
      var prevId = _focusId;
      _focusId = null;
      if(!prevId || !_markers[prevId]) return;
      (DATA.trucks || []).forEach(function(x){
        if(x.id === prevId) _markers[prevId].setContent(truckIcon(x, false));
      });
    }

    // Highlight truck i, then hand on to i+1. There is deliberately no map call of
    // any kind in here — that is the whole change. `gen` is the same generation
    // guard the cycle has always carried: a chain the panel has already replaced
    // must not keep lighting pins under the one that replaced it.
    function highlightStep(i, gen){
      if(gen !== _cycleGen) return;
      var list = tourTrucks();           // parked trucks keep their pin, just aren't walked
      if(!list.length){
        unfocus();
        el('loTown').classList.remove('on');
        highlightRail(null);
        return;
      }
      var t = list[i % list.length];
      unfocus();
      _focusId = t.id;
      if(_markers[t.id]) _markers[t.id].setContent(truckIcon(t, true));
      var town = el('loTown');
      town.innerHTML = '<span class="k">In</span><span class="v">'+esc(nearestTown(t.lat, t.lng))+'</span>';
      town.classList.add('on');
      highlightRail(t.id);
      var step = Math.max(HIGHLIGHT_MIN_MS,
                          Math.floor(panelMs('liveops') / list.length));
      _cycleTimer = setTimeout(function(){ highlightStep(i + 1, gen); }, step);
    }

    function startCycle(){
      stopCycle();
      if(!_map) return;
      // The frame is set here and then left alone for the rest of the showing.
      // All-parked (or nobody out) is a valid state: the pins stay up and the frame
      // still holds them, nobody is highlighted, and the next data refresh starts
      // the walk again the moment somebody moves.
      frameAll();
      if(tourTrucks().length) highlightStep(0, _cycleGen);
    }

    function renderLiveOps(){
      var list = DATA.trucks || [];
      var out = list.filter(function(t){ return truckState(t) !== 'yard'; }).length;

      var tag = el('loTag');
      tag.textContent = list.length ? out + ' of ' + list.length + ' out' : '';
      tag.style.display = list.length ? '' : 'none';

      // Built from TRUCK_C/TRUCK_LABEL rather than spelled out, so a state added
      // to the pins can never go missing from the key underneath them.
      el('loLegend').innerHTML = ['moving','idling','stopped'].map(function(s){
        return '<b><i style="background:'+TRUCK_C[s]+'"></i>'+TRUCK_LABEL[s]+'</b>';
      }).join('')
        + '<b><i style="background:var(--gold)"></i>Yard</b>'
        + '<b><i style="background:var(--spruce)"></i>Jobs left</b>'
        + '<b><i style="background:var(--drop-bg)"></i>Bin drop</b>'
        + '<b><i style="background:var(--pick-bg)"></i>Bin pick-up</b>';
      // No clock here — the header already has one. This slot only speaks up when
      // the GPS feed has given us nothing, which the header can't tell you.
      el('loMeta').textContent = DATA.trucksAt ? '' : 'Waiting on GPS…';

      // Every truck that is out, as a card on the right.
      var rail = railTrucks(list);
      el('loRail').innerHTML = rail.map(truckCard).join('');
      // The rail's row height needs the count, and CSS cannot count its own children.
      // Never 0: an empty rail has nothing to size, but a zero would divide by zero
      // in the grid-auto-rows calc and take the whole rule down with it.
      el('loRail').style.setProperty('--n', Math.max(1, rail.length));
      // The periodic refresh calls renderCurrent, which lands here and rebuilds
      // the rail from scratch - so the highlight has to be put back or the lit card
      // goes dark mid-walk and stays dark until the next truck.
      highlightRail(_focusId);

      // Bins-out isn't repeated here — the Operations screen already carries it.
      // These two live nowhere else on the board, so they ride in the head rather
      // than costing the map any width.
      var k = DATA.kpi || {};
      el('loCount').textContent = (k.jobsToday||0) + ' jobs today · ' + (k.completedToday||0) + ' done';

      drawTrucks();
    }

    // Which element feeds the pill beside the wordmark, per screen. The renderers
    // stay the single source of that text; this only moves it into the lockup.
    var PILL_SRC = { bins:'binsTag', kpis:'kpiMeta', liveops:'loTag' };
    function syncLockup(){
      var name = PANELS[panelIdx];
      var panel = document.querySelector('.panel[data-panel="' + name + '"]');
      var h2 = panel && panel.querySelector('h2');
      el('brandSub').textContent = h2 ? h2.textContent : 'Office Board';
      var src = el(PILL_SRC[name]);
      el('toppill').innerHTML = (src && src.style.display !== 'none') ? src.innerHTML : '';
    }
    function syncFooter(){
      var k = DATA.kpi || {};
      el('fBins').textContent = k.binsOut || 0;
      el('fTrucks').textContent = outTrucks().length;
    }

    function renderCurrent(){
      var name = PANELS[panelIdx];
      if(name==='bins') renderBins();
      else if(name==='kpis') renderKpis();
      else if(name==='liveops') renderLiveOps();
      // count the numbers up on the Bin Work + Operations screens
      if(name==='bins' || name==='kpis'){
        var panel = document.querySelector('.panel[data-panel="'+name+'"]');
        if(panel) countUp(panel);
      }
    }

    // ── rotation ─────────────────────────────────────────────────────────────
    // Send the truck across. Hidden tabs are skipped — CSS animations stall while
    // the tab is hidden, so it would otherwise sit frozen mid-screen and then jump
    // across the moment someone wakes the board.
    var _wipeTimer = null;
    function truckWipe(){
      var w = el('tvWipe');
      if(!w || document.hidden) return;
      clearTimeout(_wipeTimer);
      w.classList.remove('go');
      void w.offsetWidth;               // reflow, so the animation restarts from the top
      w.classList.add('go');
      _wipeTimer = setTimeout(function(){ w.classList.remove('go'); }, 1800);
    }

    function showPanel(i){
      panelIdx = (i+PANELS.length)%PANELS.length;
      var name = PANELS[panelIdx];
      renderCurrent();
      syncLockup();
      syncFooter();
      // the trucks screen runs the map full bleed; the other two do not
      el('board').classList.toggle('map-full', name === 'liveops');
      // ...and the map has to be told, or it keeps framing for the old box
      if(name === 'liveops' && _map) google.maps.event.trigger(_map, 'resize');
      var panels = document.querySelectorAll('.panel');
      // Conveyor slide: the panel leaving rides out left (.was) while the next
      // slides in from the right. Stale .was stripped first — self-healing if a
      // hidden-tab rotation ever left one behind.
      panels.forEach(function(p){ p.classList.remove('was'); });
      var prev = document.querySelector('.panel.on');
      panels.forEach(function(p){ p.classList.toggle('on', p.getAttribute('data-panel')===name); });
      if(prev && !prev.classList.contains('on')){
        prev.classList.add('was');
        setTimeout(function(){ prev.classList.remove('was'); }, 700);
      }
      // Truck runs the change once per full lap. Every panel would be every 20s,
      // which stops being a treat by the second hour; a lap is about 2.5 minutes.
      // `prev` guards the very first paint, where nothing is being replaced yet.
      if(panelIdx === 0 && prev) truckWipe();
      // Pull fresh truck positions as the map rotates in — once every lap rather
      // than on a timer of its own, so the pins are current exactly when they're
      // on screen and we spend nothing on Geotab's quota the rest of the time.
      if(name === 'liveops'){
        startCycle();                                   // begin with what we have
        if(!inQuietHours()) refreshTrucks();          // then restart on fresh data
      } else {
        stopCycle();                                    // nothing spinning off-screen
      }
    }
    // try/finally is load-bearing: this is a self-rearming chain, so if showPanel()
    // throws, the re-arm never runs and the wall freezes on one screen forever. The
    // old setInterval kept firing regardless; the chain has to match that.
    function nextPanel(){
      try { showPanel(panelIdx+1); }
      catch(e){ console.error('panel render failed', e); }
      finally { armRotation(); }
    }
    // A setTimeout chain rather than one setInterval, so each panel can hold the
    // screen for its own length of time.
    function armRotation(){
      clearTimeout(rotTimer);
      rotTimer = setTimeout(nextPanel, panelMs(PANELS[panelIdx]));
    }
    function startRotation(){
      showPanel(0);
      armRotation();
      // Verification hook only — inert unless the URL carries ?debug. Lets a
      // reviewer pin a panel (window.__tv.show(i)) without the rotation moving on.
      if(/[?&]debug\b/.test(location.search)){
        window.__tv = { show:function(i){ clearTimeout(rotTimer); showPanel(i); }, next:nextPanel, DATA:DATA, render:renderCurrent, brief:checkBriefing, play:playBriefing };
      }
    }

    // ── fit the fixed 1920×1080 board to the wall ─────────────────────────────
    function fitBoard(){
      el('board').style.setProperty('--s', Math.min(window.innerWidth/1920, window.innerHeight/1080));
    }

    // ── clock ────────────────────────────────────────────────────────────────
    function tickClock(){
      var d = new Date();
      el('clockT').textContent = d.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
      el('clockD').textContent = d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}).toUpperCase();
    }

    // ── weather (Open-Meteo, free, no key; Barrie-area yard coords) ──────────
    var WMO = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',56:'🌦️',57:'🌦️',
               61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',77:'🌨️',
               80:'🌦️',81:'🌦️',82:'🌦️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
    async function loadWeather(){
      try{
        var r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=44.4040&longitude=-79.6911'
          +'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto');
        var w = await r.json();
        var cur = w.current||{}, d = w.daily||{};
        if(cur.temperature_2m==null) return;
        el('wxI').textContent = WMO[cur.weather_code]||'🌡️';
        el('wxT').textContent = Math.round(cur.temperature_2m)+'°';
        el('wxHL').innerHTML = 'H '+Math.round((d.temperature_2m_max||[])[0])+'°<br>L '+Math.round((d.temperature_2m_min||[])[0])+'°';
        el('wx').classList.add('on');
      }catch(e){ console.warn('weather failed', e); }   // board just shows no weather on a blip
    }

    // ── 9 AM briefing ────────────────────────────────────────────────────────
    // A GitHub Action speaks the day's work at 9 and publishes it as a Release
    // asset. The board shows the text alongside, so if the browser blocks
    // autoplay — Chrome does, without a user gesture, and nobody touches a wall
    // display — the briefing still lands and we're told why it was silent.
    var BRIEF_URL = 'https://github.com/soramithril/jeffs-junk/releases/download/briefing/';
    var BRIEF_HOUR = 9;
    var BRIEF_SHOW_MS = 45000;

    // ── wall telemetry ──────────────────────────────────────────────────────
    // The TV is otherwise a black box that fails silently: the 2026-07-20
    // briefing test died invisibly twice, and the only diagnostic was Jake
    // standing at the wall saying "silence". Every notable event goes to the
    // proxy's tv-log action (function log only, no auth, no Geotab, nothing
    // stored). Fire-and-forget: telemetry must never be able to break the board.
    var TV_BUILD = '2026-07-21a';
    function tvLog(event, detail){
      try{
        fetch(SUPABASE_URL + '/functions/v1/geotab-proxy', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ action:'tv-log', event:event, detail:detail||'',
                                 build:TV_BUILD, at:new Date().toISOString() })
        }).catch(function(){});
      }catch(e){}
    }

    function briefDoneKey(){ return 'jj-tv-brief-' + todayStr(); }

    async function playBriefing(){
      try{
        // Release METADATA must come from api.github.com — the only GitHub host
        // that answers cross-origin fetches. The plain release-download URL does
        // NOT (verified from this page's origin: fetch dies with a CORS
        // TypeError). That's what the first wall test's silence was: the TV
        // retrying a blocked briefing.json fetch every minute, nothing to show.
        // Unauthenticated API allows 60 req/hr/IP; at worst one per minute this
        // stays at the line, and a rate-limited response just skips the tick.
        var rel = await fetch('https://api.github.com/repos/soramithril/jeffs-junk/releases/tags/briefing',
                              { cache:'no-store' })
          .then(function(r){ return r.ok ? r.json() : null; });
        if(!rel){ tvLog('brief-api-fail'); return; }
        var mp3 = (rel.assets || []).filter(function(a){ return a.name === 'briefing.mp3'; })[0];
        // The asset's upload time IS the freshness check — published today
        // (local) means today's briefing. Refuse anything else: better silent
        // than announcing yesterday's work as today's. NOT marked as played —
        // the Action may simply not have published yet; next minute-tick retries.
        if(!mp3){ tvLog('brief-no-asset'); return; }
        if(ymd(new Date(mp3.updated_at)) !== todayStr()){ tvLog('brief-stale', mp3.updated_at); return; }

        // Mark played ONLY now that a today-dated briefing is in hand. Marking
        // before the fetch (as first shipped) burned the day at 9:00 while the
        // Action was still rendering, so the wall would never have spoken at all.
        try{ localStorage.setItem(briefDoneKey(), '1'); }
        catch(e){ return; }   // no storage = no dedupe; stay silent over replaying

        // Voice-over only (Jake): the board keeps rotating, nothing on screen.
        // The one exception is a refusal — if autoplay is blocked, a silent
        // failure would be invisible, so a small note names the fix.
        var audio = new Audio(BRIEF_URL + 'briefing.mp3?t=' + Date.now());
        // The element's error event catches what play() can't: a media that
        // starts, then dies on the redirect chain or a decode fault mid-stream.
        audio.addEventListener('error', function(){
          tvLog('brief-audio-error', String(audio.error && audio.error.code));
        });
        audio.addEventListener('playing', function(){ tvLog('brief-playing'); });
        audio.addEventListener('ended', function(){ tvLog('brief-ended'); });
        tvLog('brief-attempt');
        audio.play().then(function(){
          tvLog('brief-play-accepted');
        }).catch(function(err){
          console.warn('briefing autoplay blocked', err);
          // Diagnostic probe: many kiosks allow MUTED autoplay only. If muted
          // playback is accepted, the blocker is precisely the audible-autoplay
          // policy — worth knowing before touching Yodeck settings blind.
          var probe = new Audio(BRIEF_URL + 'briefing.mp3?t=' + Date.now());
          probe.muted = true;
          probe.play().then(function(){ probe.pause(); tvLog('brief-blocked-muted-ok', String(err && err.name)); })
                      .catch(function(e2){ tvLog('brief-blocked-fully', String(err && err.name) + '/' + String(e2 && e2.name)); });
          el('briefWarn').textContent = 'Briefing audio blocked — Yodeck needs autoplay '
            + '(--autoplay-policy=no-user-gesture-required).';
          el('brief').classList.add('on');
          setTimeout(function(){ el('brief').classList.remove('on'); }, BRIEF_SHOW_MS);
        });
      }catch(e){ tvLog('brief-error', String(e)); console.warn('briefing failed', e); }
    }

    // Ticks every minute. From 9 AM it keeps trying until a today-dated briefing
    // is found and played, then the marker (set in playBriefing, only on success)
    // stops it for the rest of the day. Retrying matters: the Action publishes a
    // few minutes AFTER the hour, so the first checks of the day legitimately
    // find nothing — burning the marker up front here (as first shipped) meant
    // the wall checked once at 9:00, missed, and stayed silent forever.
    function checkBriefing(){
      if(new Date().getHours() < BRIEF_HOUR) return;
      if(inQuietHours()) return;
      try{
        if(localStorage.getItem(briefDoneKey())) return;
        // Sweep old date-keyed markers — without this the board accrues one dead
        // ~30-byte key per day, forever, and it runs unattended for months.
        //
        // Collect first, THEN remove: localStorage.key(i) order is unspecified
        // and may reshuffle after a removeItem, so deleting while iterating can
        // let a key hop past the cursor — verified, one of 30 seeded stale keys
        // survived a backwards-iterating sweep.
        var stale = [];
        for(var i = 0; i < localStorage.length; i++){
          var k = localStorage.key(i);
          if(k && k.indexOf('jj-tv-brief-') === 0 && k !== briefDoneKey()) stale.push(k);
        }
        stale.forEach(function(s){ localStorage.removeItem(s); });
      }catch(e){ return; }   // no storage means we can't dedupe, so don't play
      playBriefing();
    }

    // ── net status ───────────────────────────────────────────────────────────
    function net(ok){ el('netdot').classList.toggle('bad', !ok); }

    // ── self-update: reload when a NEW office-tv.html is deployed ──────────────
    // Yodeck (and the browser) cache the page, so a new deploy can sit stale on the
    // wall indefinitely. This polls the file's ETag straight from GitHub — a HEAD with
    // cache:'no-store' + a unique query, so no cache can answer it. When the content
    // changes the ETag changes → reload cache-busted (?r=), carrying the display
    // creds forward in the hash so the reloaded page always re-auths (the persisted
    // session isn't reliable across a Yodeck reload — see below).
    var _tvEtag = null, _tvPending = null;
    async function checkForUpdate(){
      try{
        var r = await fetch(location.pathname + '?u=' + Date.now(), { method:'HEAD', cache:'no-store' });
        if(!r.ok) return;
        var tag = r.headers.get('etag') || r.headers.get('last-modified');
        if(!tag) return;
        if(_tvEtag === null){ _tvEtag = tag; return; }        // first poll = baseline
        if(tag === _tvEtag){ _tvPending = null; return; }     // unchanged (or settled back) — nothing pending
        // Changed vs baseline: reload only once the SAME new version shows up on two
        // checks in a row. Right after a deploy the CDN can briefly serve old/new from
        // different edges; requiring two matching reads means one clean reload, never
        // a couple in a row.
        if(tag === _tvPending){
          // Carry the display creds forward in the hash so the reloaded page can
          // ALWAYS sign itself back in. The self-reload drops the original Yodeck
          // hash, and the persisted session does NOT reliably survive a Yodeck
          // reload — without this the board stranded on the "needs display link"
          // gate after every update until someone reloaded it by hand.
          var frag = _tvCreds ? ('#e='+encodeURIComponent(_tvCreds.email)+'&p='+encodeURIComponent(_tvCreds.pass)) : '';
          tvLog('reload-for-update');
          location.replace(location.pathname + '?r=' + Date.now() + frag);
        }
        else { _tvPending = tag; }
      }catch(e){ /* offline blip — retry next tick */ }
    }

    // ── auth: one path — must be the display account ─────────────────────────
    function parseCreds(){
      var h = (location.hash||'').replace(/^#/,'');
      if(!h) return null;
      var q = new URLSearchParams(h);
      var email = q.get('e') || q.get('u');
      var pass = q.get('p');
      return (email && pass) ? {email:email, pass:pass} : null;
    }
    function stripHash(){ history.replaceState(null,'', location.pathname + location.search); }
    function fail(msg){ el('gateSpin').style.display='none'; el('gateMsg').innerHTML = esc(msg); }

    // Stash the display credentials in memory. They arrive in the URL hash and the
    // hash is then stripped; keeping a copy lets this 24/7 board sign itself back
    // in whenever its token lapses — without waiting for a Yodeck page reload.
    var _tvCreds = null;

    async function authenticate(){
      if(!_tvCreds) _tvCreds = parseCreds();
      var sess = (await db.auth.getSession()).data.session;
      if(!sess){
        if(!_tvCreds){ fail('This screen needs the office display link. Ask an admin to set it up.'); return null; }
        var r = await db.auth.signInWithPassword({ email:_tvCreds.email, password:_tvCreds.pass });
        stripHash();
        // A sign-in error at a 24/7 wall is almost always the office Wi-Fi dropping
        // mid-request — throw so boot() retries in place (and self-heals when the
        // connection returns) rather than parking on an error screen.
        if(r.error){ throw r.error; }
        sess = r.data.session;
      } else { stripHash(); }
      if(!sess || (sess.user && sess.user.email !== DISPLAY_EMAIL)){
        try{ await db.auth.signOut(); }catch(e){}
        fail('This screen is for the office display only.');
        return null;
      }
      return sess;
    }

    // Every board read now needs a logged-in session (RLS lockdown, July 2). Before
    // a refresh, make sure the session is present and not about to expire; if it's
    // gone or stale, sign back in with the stashed display credentials. Without this
    // the 15-min refresh silently reads as logged-out and the board goes empty/stale.
    async function ensureFreshSession(){
      var sess = (await db.auth.getSession()).data.session;
      var leftMs = (sess && sess.expires_at) ? (sess.expires_at*1000 - Date.now()) : -1;
      if(!sess || leftMs < 120000){        // missing, expired, or expiring within 2 min
        if(!_tvCreds) _tvCreds = parseCreds();
        if(!_tvCreds) throw new Error('session lapsed and no display credentials to re-auth');
        var r = await db.auth.signInWithPassword({ email:_tvCreds.email, password:_tvCreds.pass });
        if(r.error) throw r.error;
      }
    }

    // ── boot ─────────────────────────────────────────────────────────────────
    var _bootFails = 0;
    async function boot(){
      try{
        var sess = await authenticate();   // returns null ONLY for a permanent stop
        if(!sess) return;                  //   (no display link / wrong account) — leave that message up
        await loadAll(); net(true); _bootFails = 0;
      }catch(e){
        console.error(e); net(false);
        // A failure here is a transient blip — the office Wi-Fi dropped mid sign-in
        // or mid data-load. We RETRY IN PLACE with a gentle backoff and let the
        // connection come back, keeping the "reconnecting" screen up. We do NOT
        // reload: reloading can't fix a blip (a genuinely broken build never parses,
        // so it never reaches this catch), and the old 3-strikes reload is exactly
        // what stranded the wall in a loop on the loading screen. New builds are
        // still picked up by checkForUpdate(), so nothing goes stale.
        _bootFails++;
        el('gateMsg').textContent = 'Reconnecting to dispatch — hang tight…';
        setTimeout(boot, Math.min(30000, 6000 * _bootFails));   // 6s, 12s, 18s … capped at 30s
        return;
      }
      el('gate').style.display='none';
      el('viewport').style.display='flex';
      // A boot ping per page-load: its presence with a NEW build id is the only
      // remote proof the wall actually picks up deploys.
      tvLog('boot');
      fitBoard(); window.addEventListener('resize', fitBoard);
      tickClock(); setInterval(tickClock, 1000);
      // One-shot (2026-07-20): clear today's played-marker so the wall can demo
      // the briefing the evening it shipped — it proves the Yodeck autoplay
      // question a day early. The reset key deliberately does NOT carry the
      // 'jj-tv-brief-' prefix, so the daily marker sweep never removes it: each
      // reset id fires exactly once per device, ever. Bump the id to re-arm.
      try{
        if(!localStorage.getItem('jj-tv-briefreset-1')){
          localStorage.removeItem(briefDoneKey());
          localStorage.setItem('jj-tv-briefreset-1', '1');
        }
      }catch(e){}
      checkBriefing(); setInterval(checkBriefing, 60000);   // 9 AM spoken briefing
      loadWeather(); setInterval(loadWeather, 30*60*1000);
      startRotation();
      // Prime the pins so the map screen has trucks on it the first time it rotates in.
      if(!inQuietHours()) refreshTrucks();
      // Auto-pick-up new deploys (bypasses Yodeck/browser cache) so the wall never
      // sits stale — checks every 5 min and reloads itself when a new build ships.
      checkForUpdate(); setInterval(checkForUpdate, 5*60*1000);
      // periodic refresh; keep showing last-good data on a blip
      setInterval(async function(){
        if(inQuietHours()) return;
        try{
          await ensureFreshSession();
          await loadAll(); net(true); renderCurrent();
        }catch(e){
          console.error('refresh failed', e); net(false);
          // one recovery attempt: force a fresh sign-in, then retry the load
          try{
            if(!_tvCreds) _tvCreds = parseCreds();
            if(_tvCreds){
              var r = await db.auth.signInWithPassword({ email:_tvCreds.email, password:_tvCreds.pass });
              if(!r.error){ await loadAll(); net(true); renderCurrent(); }
            }
          }catch(e2){ console.error('re-auth retry failed', e2); }
        }
      }, REFRESH_MS);
    }

    boot();
  })();
  </script>
</body>
</html>
