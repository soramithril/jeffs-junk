<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeff's Junk — Office Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
  // Google Maps key. PUBLIC BY DESIGN — a browser map key cannot be hidden the
  // way the Places key is (that one lives as a secret on the places-proxy edge
  // function; a map has to load in the page, so its key rides along). What
  // protects it is not secrecy:
  //   · locked to https://soramithril.github.io/*  (website restriction)
  //   · restricted to the Maps JavaScript API alone
  //   · capped daily under APIs & Services → Maps JavaScript API → Quotas
  // Worst case if someone lifts it: they draw a map, and the cap stops that too.
  //
  // Cost: only a MAP LOAD is billed, and the map is built once per page load and
  // reused — every pan, zoom and truck-to-truck hop after that is free. The board
  // reloads itself on deploy, so roughly 170 loads a month against 10,000 free.
  // The traffic layer is a layer over that same map: no extra billable event.
  var GMAPS_KEY = 'AIzaSyDP9mUAQ0DCWBt8GRQN6649senq4hIDIG8';
  // Defined HERE, in the same block that injects the loader, so it cannot lose a
  // race with it. The board's own script runs later and hangs its work on
  // __onGmaps; if Maps happened to land first, that script checks .done and
  // catches up. Google will call an undefined callback and give up silently.
  window.__gmapsReady = function(){
    window.__gmapsReady.done = true;
    if(window.__onGmaps) window.__onGmaps();
  };
  (function(){
    if(!GMAPS_KEY) return;               // no key, no map panel — the rest of the board runs
    var s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(GMAPS_KEY)
          + '&v=weekly&loading=async&callback=__gmapsReady';
    s.async = true;
    document.head.appendChild(s);
  })();
</script>
<style>  /* ── "Field Map" office TV board — a dark terrain photograph with cream type
     and dark translucent cards floating on it. Ported from the approved
     tv-board-fieldmap mockup; every colour below is that mockup's.

     Authored on a fixed 1920×1080 stage (design handoff) and scaled to fill any
     16:9 wall with a single transform. The letterbox areas fall back to the same
     deep ground colour as the board, so nothing shows a seam.

     Type: Inter alone, as the approved mockup draws it. Display type — the
     wordmark, the clock, driver names, big numerals, chips and badges — is
     weight 900 and tracked tighter, so it carries the same presence at the same
     pixel sizes; labels and body copy sit between 500 and 800. ── */
  :root{
    /* the mockup's palette, verbatim */
    --cream:#f5efde; --muted:#d7cfb2; --line:rgba(241,229,186,.16);
    --gold:#e2c364; --gold-rule:#cdb45f; --gold-line:#e0cf91;
    --done-bg:#4e6655; --done-fg:#d8e3d3;
    /* The struck-through red. Not a Field Map colour - deliberately: it is the one
       thing on the bins screen allowed to shout, because it is the one thing the
       office has to read from the far side of the room.
       Worth knowing it is the SECOND red here. The "Assign!" button is #db5038 ->
       #c83727, so red already means "this needs a driver, act now" and now also
       means "finished" - opposite meanings on one colour. They are told apart by
       form rather than hue: a small raised button against a line drawn the whole
       width of a row. This one also sits cooler and pinker than the button's
       orange-red. If the two ever read as one thing on the wall, this is the note
       that explains why and this is the value to change. */
    --struck:#e0475c; --struck-glow:rgba(224,71,92,.34);
    --todo-bg:#8a7532; --todo-fg:#f6e2a2;
    --drop-bg:#465d72; --drop-fg:#cde0ef;
    --pick-bg:#75455e; --pick-fg:#f0cbe2;
    --alert-a:#cc3125; --alert-b:#df4a33; --alert-line:rgba(245,104,76,.36);
    /* the ground, and the one image this sheet is allowed to load */
    --ground:#0d140f;
    --terrain:url('assets/tv-terrain.jpg?v=676');
    --scrim:linear-gradient(rgba(21,27,21,.34), rgba(21,27,21,.34));
    /* the floating card: fill, edge, lift */
    --card-fill:linear-gradient(180deg, rgba(25,33,25,.74), rgba(17,24,18,.86));
    --card-line:rgba(241,229,186,.18);
    --card-lift:inset 0 1px 0 rgba(255,255,255,.05), 0 14px 28px rgba(0,0,0,.18);
    /* pale plate — the count pill, the pin rings: the few things that stay light */
    --plate:#f5f0e4;
    /* dark ink, for type that sits ON gold or on a pale plate */
    --ink:#1a2415;
    /* --spruce, --gold, --drop-bg and --pick-bg are the only custom properties the
       PAGE SCRIPT writes into markup (renderLiveOps builds the map legend swatches
       from all four). Each must therefore stay defined AND stay identical to the
       fill of the pin it explains — --spruce to .lo-job, --drop-bg to .lo-bin.drop,
       --pick-bg to .lo-bin.pick — or the key stops matching the pins it explains. */
    --spruce:#1e2c20;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; height:100%; width:100%; overflow:hidden;
    background:var(--ground);
    color:var(--cream);
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none; cursor:none;
  }

  @keyframes pdSpin{to{transform:rotate(360deg)}}
  @keyframes pdHaze{0%,100%{opacity:.7}50%{opacity:.96}}
  @keyframes truckRoll{0%{transform:translateX(0)}50%{transform:translateX(26px)}100%{transform:translateX(0)}}
  /* the unassigned-driver card breathes an alert-red halo rather than the old
     drop-shadow ring — the card now carries a real shadow of its own, and two
     shadows on one element fight */
  @keyframes pulseWarn{
    0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 14px 28px rgba(0,0,0,.22)}
    50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 14px 28px rgba(0,0,0,.22), 0 0 0 7px rgba(223,74,51,.20)}
  }

  /* ── Startup / Standby (also the access-gate + error state) ──
     Same ground as the board so a boot, a reconnect and a working wall all read
     as one screen rather than three. Heavier scrim than the board: this is pure
     type on the photograph with no cards to buy back contrast. */
  #gate{
    position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; padding:60px; text-align:center;
    background-color:var(--ground);
    background-image:linear-gradient(rgba(13,20,15,.62), rgba(13,20,15,.62)), var(--terrain);
    background-size:100% 100%, cover;
    background-position:center, center;
    background-repeat:no-repeat, no-repeat;
    color:var(--cream);
  }
  #gate .gate-dots{position:absolute; inset:0;
    background-image:radial-gradient(rgba(241,229,186,.05) 2px, transparent 2.4px); background-size:34px 34px}
  #gate .gate-spin{position:relative; width:150px; height:150px; border-radius:50%;
    border:9px solid rgba(226,195,100,.22); border-top-color:var(--gold); animation:pdSpin 1.1s linear infinite}
  #gate .gate-truck{position:relative; width:440px; animation:truckRoll 4.5s ease-in-out infinite;
    filter:drop-shadow(0 16px 22px rgba(0,0,0,.6))}
  #gate .gate-h{position:relative; font:900 84px/1 Inter; color:var(--cream); margin-top:14px;
    letter-spacing:-.03em; text-shadow:0 3px 14px rgba(8,14,9,.6)}
  #gate .gate-sub{position:relative; font:600 34px/1.3 Inter; color:var(--muted); max-width:22em;
    text-shadow:0 2px 10px rgba(8,14,9,.55)}
  #gate .gate-pulse{position:relative; display:flex; gap:16px; margin-top:10px}
  #gate .gate-pulse span{width:20px; height:20px; border-radius:50%; background:var(--gold);
    animation:pdHaze 1.2s ease-in-out infinite}
  #gate .gate-pulse span:nth-child(2){animation-delay:.2s}
  #gate .gate-pulse span:nth-child(3){animation-delay:.4s}
  #gate .gate-foot{position:absolute; left:0; right:0; bottom:46px;
    display:flex; align-items:center; justify-content:center; gap:16px}
  #gate .gate-foot img{height:60px; opacity:.9}
  #gate .gate-foot span{font:700 22px/1 Inter; letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold-line)}

  /* ── the 1920×1080 board, centred + scaled to the viewport ── */
  #viewport{position:fixed; inset:0; display:none; align-items:center; justify-content:center; overflow:hidden; z-index:1}
  /* The photograph lives on #board, not on <body>, so it scales with the stage
     transform instead of stretching across whatever wall it is projected on.
     The scrim is the top layer and is what buys the type its contrast back —
     without it the board is only readable over the dark parts of the imagery. */
  #board{
    position:relative; flex:0 0 auto; width:1920px; height:1080px; overflow:hidden;
    background-color:var(--ground);
    background-image:var(--scrim), var(--terrain);
    background-size:100% 100%, cover;
    background-position:center, center;
    background-repeat:no-repeat, no-repeat;
    display:flex; flex-direction:column; padding:34px 40px 0; gap:24px;
    transform:scale(var(--s,1)); transform-origin:center center;
  }
  /* ambient brand art — truck tucked under the weather box (top-right) with a bin
     snug to its left (a random one of our board renders each page load). Both lifted
     above the panels (z-index) so they ride on top of everything. Gentle roll / bob.
     On a dark ground the drop-shadows go near-black; the old warm-grey shadow was
     invisible against the terrain. */
  #topbar{position:relative; z-index:2}
  #stage{z-index:1}

  /* ── shared header chrome ──
     The spruce pill is GONE: the top block now sits directly on the terrain, as
     the mockup does. The screen title moved up here too — the page script mirrors
     each panel's title into .brand-sub and its tag into #toppill, so a panel no
     longer carries a heading of its own (see .p-head below).
     Everything in this block is bare type on a photograph, so it all takes a soft
     dark text-shadow: the scrim alone cannot promise a dark pixel behind a stroke
     wherever the imagery happens to land. */
  #topbar{display:flex; align-items:flex-start; gap:40px; flex:0 0 auto;
    text-shadow:0 2px 10px rgba(8,14,9,.55)}
  #brand{display:flex; align-items:center; gap:22px; min-width:0; flex:0 0 auto}
  .brand-name{font:900 68px/.94 Inter; color:var(--cream); letter-spacing:-.035em}
  /* the screen title: gold, wide-tracked, behind a short gold rule */
  .brand-sub{margin-top:13px; display:flex; align-items:center; gap:18px;
    font:700 21px/1 Inter; letter-spacing:.33em; text-transform:uppercase;
    color:var(--gold-line)}
  .brand-sub::before{content:''; flex:0 0 auto; width:93px; height:3px;
    background:var(--gold-rule); border-radius:2px}
  /* the progress pill — "3 of 8 DONE", "4 of 5 OUT". The renderers wrap the
     numerals in bare <span>s, which is what makes them gold and huge here.
     :empty hides it, so a screen with no tag leaves no floating shell behind. */
  #toppill{flex:0 0 auto; margin-top:10px; display:flex; align-items:baseline; gap:14px;
    padding:14px 30px; border-radius:26px; border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(60,64,49,.72), rgba(41,45,35,.88));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    font:900 30px/1 Inter; color:var(--cream);
    letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; text-shadow:none}
  #toppill:empty{display:none}
  #toppill span{font-size:52px; line-height:1; color:var(--gold)}
  #tright{margin-left:auto; display:flex; align-items:center; gap:26px; flex:0 0 auto; padding-top:6px}
  #wx{display:none; align-items:center; gap:14px}
  #wx.on{display:flex}
  #wx .i{font-size:44px; line-height:1}
  #wx .t{font:900 54px/1 Inter; color:var(--cream); font-variant-numeric:tabular-nums}
  #wx .hl{font:600 19px/1.2 Inter; color:var(--muted); white-space:nowrap}
  #clock{text-align:right}
  #clock .t{font:900 62px/.95 Inter; color:var(--cream); letter-spacing:-.045em;
    font-variant-numeric:tabular-nums}
  #clock .d{margin-top:8px; font:800 19px/1 Inter; color:var(--gold-line);
    letter-spacing:.18em; text-transform:uppercase}

  /* ── panels ── */
  #stage{position:relative; flex:1 1 auto; min-height:0; overflow:hidden; margin:0 -40px}
  /* the bins and operations screens keep the board's side margin; only the map
     is allowed to run to the edge */
  .panel[data-panel="bins"] .p-body,
  .panel[data-panel="kpis"] .p-body{padding:0 40px}
  /* Rotation is a conveyor since v543-era slide upgrade: waiting panels sit off-right,
     the exiting one (.was, set by showPanel for ~.7s) rides off-left. Class-driven end
     states, so a hidden tab that skips the transition still lands correct. */
  /* The scale is what turns a flat slide into cards on a conveyor: a panel sits
     back slightly while it waits and while it leaves, and comes fully forward
     only when it is the one being read. The curve overshoots a touch so it
     settles rather than stops dead. Duration stays inside the .7s that showPanel
     waits before stripping .was. UNCHANGED by the restyle — the rotation is
     load-bearing and tuned; only colour-level things moved. */
  .panel{position:absolute; inset:0; display:flex; flex-direction:column; gap:24px; min-height:0;
    opacity:0; visibility:hidden; transform:translateX(103%) scale(.94);
    transition:transform .6s cubic-bezier(.3,1.12,.4,1), opacity .55s ease, visibility .6s}
  .panel.on{opacity:1; visibility:visible; transform:translateX(0) scale(1)}
  .panel.was{opacity:0; visibility:visible; transform:translateX(-103%) scale(.94)}
  /* The per-panel heading is gone from the design: its title and tag are mirrored
     into .brand-sub and #toppill by the page script, and a second heading under
     the wordmark just repeated it. Hidden rather than deleted because the
     renderers still write into the nodes inside it (#binsTag, #binsMeta, #kpiMeta,
     #loTag, #loCount, #loMeta) and a missing node would throw. */
  .p-head{display:none}
  .p-body{flex:1 1 auto; min-height:0}

  /* ── Trucks: the map is the whole board ──────────────────────────────────
     The stage leaves the flow so it can cover all 1920x1080, and the header and
     footer float on top of it. Both get their own scrim: live imagery is not a
     background you can trust for contrast the way the terrain photograph was.
     Only this screen - #board carries .map-full only while liveops is up, and
     the other two keep the board's margins.
     The footer deliberately stops short of the bottom edge. Google's logo and
     the map attribution sit down there and covering them breaks the terms of
     use, so the bar floats and leaves that strip showing. */
  #board.map-full #stage{position:absolute; inset:0; margin:0; z-index:0}
  #board.map-full #topbar{
    position:absolute; left:0; right:0; top:0; z-index:6; margin:0;
    padding:34px 40px 30px;
    background:linear-gradient(180deg, rgba(11,17,12,.88), rgba(11,17,12,.5) 60%, transparent);
  }
  /* Every truck on screen at once, down the right, instead of one card riding
     the map. The tour still walks truck to truck - it now lights the matching
     card rather than opening a popup over the pin. */
  #loRail{position:absolute; right:40px; top:206px; bottom:146px; width:320px; z-index:5;
    display:grid; gap:10px; align-content:start;
    /* A card is one sixth of the rail: the height six of them plus their five gaps
       would take. A two-truck day leaves the cards that same proper size at the top
       with clear space below, instead of stretching each one to half the screen.
       Written as a sum rather than a magic 113px so it follows the rail if the rail
       ever moves.
       The second term only bites past six. RAIL_MAX is the whole fleet (8) now that
       parked trucks get a card, and eight of these would run off the bottom - so the
       row takes whichever is smaller: the settled six-up height, or an even share of
       the rail between however many cards there are. --n is written by renderLiveOps
       and is the only thing here that knows the count. */
    grid-auto-rows:minmax(0, min(calc((100% - 50px) / 6),
                                 calc((100% - (var(--n, 6) - 1) * 10px) / var(--n, 6))))}
  #loRail .card{min-height:0; overflow:hidden; border-radius:16px; display:flex; flex-direction:column;
    border:1px solid var(--card-line); background:rgba(15,22,16,.86);
    box-shadow:0 10px 26px rgba(0,0,0,.45); transition:box-shadow .3s ease}
  #loRail .card .hd{flex:0 0 auto; height:40px; display:flex; align-items:center; gap:10px; padding:0 14px}
  #loRail .card .hd .nm{font:900 23px/1 Inter; letter-spacing:-.03em; color:var(--ink); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  #loRail .card .hd .st{margin-left:auto; flex:0 0 auto; font:800 13px/1 Inter;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink); opacity:.88}
  #loRail .card .bd{flex:1 1 auto; min-height:0; padding:6px 14px; display:flex;
    flex-direction:column; justify-content:center; gap:4px}
  #loRail .card .rw{display:flex; align-items:baseline; gap:10px; min-width:0;
    font:600 17px/1.15 Inter; color:var(--muted)}
  #loRail .card .rw span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #loRail .card .rw b{margin-left:auto; flex:0 0 auto; font:900 19px/1 Inter; color:var(--cream)}
  #loRail .card .rw.sm{font-size:15px}
  #loRail .card .rw.sm b{font-size:16px}
  /* the truck the map is currently sitting on */
  #loRail .card.on{box-shadow:0 0 0 3px var(--gold), 0 12px 30px rgba(0,0,0,.55)}
  /* the town chip would sit under the rail on the right, so it moves left */
  #board.map-full #loTown{right:auto; left:40px; top:206px}
  /* The key is static reference, so on this screen it rides ON the footer bar
     instead of floating over the map, where it was hiding trucks in the
     bottom-left corner of the fleet overview. No plate of its own - the footer
     already provides one - and it has to out-rank #botbar's z-index or the bar
     it sits on covers it. */
  #board.map-full #loLegend{
    left:50%; right:auto; bottom:56px; transform:translateX(-50%); z-index:7;
    background:none; border:0; box-shadow:none; padding:0; gap:28px;
  }
  /* set like the footer's own labels so it reads as part of the bar rather than
     something left sitting on top of it */
  #board.map-full #loLegend b{
    font:500 20px/1 Inter; letter-spacing:.16em; text-transform:uppercase; color:#efe6c3;
  }

  #board.map-full #botbar{
    position:absolute; left:40px; right:40px; bottom:34px; z-index:6; margin:0;
    height:88px; padding:0 28px; border-radius:20px;
    border:1px solid var(--card-line); border-top:1px solid var(--card-line);
    background:rgba(15,22,16,.84);
  }

  /* ── Screen 1 · Bin Work Today ── */
  #binsWrap{height:100%; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:24px}
  .bb-group{background:var(--card-fill); border:1px solid var(--card-line); border-radius:24px;
    box-shadow:var(--card-lift);
    overflow:hidden; display:flex; flex-direction:column; min-height:0}
  /* nobody assigned — the mockup's alert card: a red-shifted fill, a red edge,
     and a slow halo so it catches the room from across the office */
  .bb-group.warn{background:linear-gradient(180deg, rgba(64,24,20,.82), rgba(56,21,19,.92));
    border-color:var(--alert-line); animation:pulseWarn 2.4s ease-in-out infinite}
  /* The strip's colour comes from the DATABASE, written inline as
     `style="background:<hex>"`, so the mockup's per-driver gradients CANNOT be
     hard-coded here — an inline background wins over any rule in this sheet.
     Instead the flat inline colour is kept and the mockup's two overlays are
     rebuilt on top of it: the topographic texture through ::before (the same
     photograph, low opacity, blended over) and the gloss through ::after. The
     result reads as the mockup's head bar whatever hex the driver carries. */
  .bb-strip{position:relative; overflow:hidden; display:flex; align-items:center;
    justify-content:space-between; gap:14px; padding:12px 22px; flex:0 0 auto; color:#fff}
  .bb-strip::before{content:''; position:absolute; inset:0; opacity:.22; mix-blend-mode:overlay;
    background:var(--terrain) center/cover; pointer-events:none}
  .bb-strip::after{content:''; position:absolute; inset:0; pointer-events:none; opacity:.35;
    background-image:linear-gradient(180deg, rgba(255,255,255,.12), transparent 50%)}
  .bb-name{position:relative; z-index:1; font:900 36px/1 Inter; color:#fff;
    letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow:0 2px 6px rgba(0,0,0,.35)}
  .bb-count{position:relative; z-index:1; flex:0 0 auto; font:900 22px/1 Inter;
    background:var(--plate); border-radius:999px; padding:8px 17px; white-space:nowrap}
  /* --cs scales the leg rows (1 = full size); fitBins() dials it down per card so
     every drop-off/pick-up fits with no clipping. EVERY row dimension below stays
     proportional to --cs — the moment one stops scaling, fitBins() can no longer
     shrink a heavy day to fit and the card clips. */
  .bb-body{--cs:1; flex:1 1 auto; min-height:0; padding:6px 18px; display:flex; flex-direction:column; justify-content:space-around; overflow:hidden}
  .bb-row{display:grid; grid-template-columns:calc(96px*var(--cs)) minmax(0,1fr) calc(90px*var(--cs)) calc(106px*var(--cs)); align-items:center; gap:calc(10px*var(--cs)); padding:calc(8px*var(--cs)) 0}
  .bb-row:not(.last){border-bottom:1px solid rgba(235,224,183,.12)}
  /* Done legs read as COMPLETED (Jake 2026-07-07). The old treatment was a soft
     green wash behind the leg; on the dark board the mockup does it with weight
     instead — the whole row steps back and the town is struck through. Same
     "crossed off" read, and the ✓ Done pill still carries the fact. */
  /* Done work goes dark and takes a neon line straight through it. Three things
     were wrong with the strikethrough this replaces, and all three are the same
     mistake - the mark shrank and faded exactly when it mattered most:

       1. It was drawn only through .bb-city, so it struck the town name and left
          the rest of the row looking live.
       2. Its thickness was calc(2px * var(--cs)). fitBins() dials --cs down to fit
          a busy card, so on the fullest day of the week the line thinned to under
          a pixel - invisible at 4 metres, invisible at 1 metre.
       3. opacity on the whole row faded the strike along with the text, so the one
          element that needed to stay bright was dimmed with everything else.

     So: the dimming moves onto the row's CONTENTS and the line is drawn over the
     top at full strength, full row width, at a FIXED 5px that never scales. It is
     absolutely positioned, which is what lets it ignore --cs without breaking
     anything - it contributes no height, so fitBins()'s row measurements are
     untouched and the scaling contract above still holds.

     Presence, not colour, carries the meaning: a row either has a line through it
     or it does not, which reads the same to someone who cannot see red at all. */
  .bb-row.done{position:relative}
  .bb-row.done > *{opacity:.36}
  /* Tapered to nothing at both ends, and the glow is a suggestion rather than a
     bloom. The first version of this was a hard neon bar with a double glow, and
     on a board that is otherwise cream, gold and dark ground it read as hazard
     tape - it was the only saturated thing on the screen. Same signal, same width,
     same fixed thickness; it just stops shouting. */
  .bb-row.done::after{
    content:''; position:absolute; left:0; right:0; top:50%; height:4px;
    transform:translateY(-50%); border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--struck) 8%,
                                      var(--struck) 92%, transparent);
    box-shadow:0 0 14px var(--struck-glow);
  }
  .bb-size{font-weight:900; font-family:Inter; font-size:calc(26px*var(--cs)); line-height:1;
    color:#efd38a; background:rgba(243,233,201,.05); border:2px solid rgba(225,187,78,.75);
    border-radius:13px; padding:calc(8px*var(--cs)) 4px; text-align:center; white-space:nowrap}
  /* on the alert card the badge brightens so it holds its own against the red fill */
  .bb-size.warn{color:#f6ecd0; background:rgba(255,255,255,.06); border-color:rgba(245,235,205,.85)}
  .bb-dest{min-width:0; display:flex; flex-direction:column; gap:calc(4px*var(--cs))}
  .bb-city{font-weight:900; font-family:Inter; font-size:calc(30px*var(--cs)); line-height:1;
    color:#f5f1e0; text-transform:uppercase; letter-spacing:-.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  /* customer · time. The thinnest text on the board, so it takes the mockup's
     brightest muted tone (#d1cab0 on the card fill clears 4.5:1 comfortably)
     rather than a true grey. */
  .bb-who{font-weight:500; font-family:Inter; font-size:calc(18px*var(--cs)); line-height:1.15;
    color:#d1cab0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bb-kind{font-weight:900; font-family:Inter; font-size:calc(18px*var(--cs)); line-height:1;
    letter-spacing:.04em; text-transform:uppercase; border-radius:12px;
    padding:calc(8px*var(--cs)) 0; text-align:center}
  .bb-kind.k-drop{background:var(--drop-bg); color:var(--drop-fg)}
  .bb-kind.k-pick{background:var(--pick-bg); color:var(--pick-fg)}
  .bb-state{font-weight:900; font-family:Inter; font-size:calc(20px*var(--cs)); line-height:1;
    border-radius:14px; padding:calc(9px*var(--cs)) 0; text-align:center}
  .bb-state.s-done{background:var(--done-bg); color:var(--done-fg)}
  .bb-state.s-todo{background:var(--todo-bg); color:var(--todo-fg)}
  /* "Assign!" — the one thing on the board that is a demand, so it keeps the
     mockup's raised red button rather than becoming another flat chip */
  .bb-state.s-assign{color:#fff; letter-spacing:.05em;
    background:linear-gradient(180deg, #db5038, #c83727); box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .bins-empty{height:100%; display:flex; align-items:center; justify-content:center;
    font:900 56px/1.15 Inter; letter-spacing:-.02em; color:var(--muted); text-align:center; padding:0 8%;
    text-shadow:0 2px 10px rgba(8,14,9,.55)}

  /* ── Screen 2 · Crew · This Week ──
     Off the rotation since 2026-09-06, but the markup and renderer are still in
     the page, so the grid keeps a home in the new palette rather than a dead one
     in the old. */
  #schedWrap{height:100%; display:grid; gap:10px}
  .day{display:flex; align-items:center; justify-content:center; font:900 27px/1 Inter;
    color:var(--muted); background:rgba(243,233,201,.09); border:1px solid var(--line); border-radius:14px}
  .day.today{flex-direction:column; color:var(--ink); background:var(--gold); border-color:transparent}
  .day.today .tlab{font:800 13px/1 Inter; letter-spacing:.16em; margin-top:4px}
  .rname{display:flex; align-items:center; gap:13px; padding:0 22px; background:var(--card-fill);
    border:1px solid var(--card-line); border-radius:14px; overflow:hidden}
  .rname .pdot{width:15px; height:15px; border-radius:50%; flex:0 0 auto}
  .rname .pn{font:900 29px/1 Inter; letter-spacing:-.02em; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cell{display:flex; align-items:center; justify-content:center; border-radius:14px; overflow:hidden; text-align:center}
  .cell.work{flex-direction:column; gap:2px; background:var(--card-fill); border:1px solid var(--card-line);
    box-shadow:var(--card-lift); padding:0 6px}
  .cell.work .wt{font:900 24px/1.05 Inter; color:var(--cream)}
  .cell.work .wl{font:500 15px/1.15 Inter; color:var(--muted); max-width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cell.work.today{border-color:var(--gold); box-shadow:inset 0 0 0 2px rgba(226,195,100,.55)}
  .cell.work.today .wl{color:var(--gold-line)}
  .cell.off{background:rgba(243,233,201,.05); color:rgba(215,207,178,.55); font:900 22px/1 Inter}
  .cell.off.today{box-shadow:inset 0 0 0 2px rgba(226,195,100,.4)}
  .cell.sick{background:var(--todo-bg); color:var(--todo-fg); font:900 22px/1 Inter}
  .cell.jx{background:var(--drop-bg); color:var(--drop-fg); font:600 16px/1.15 Inter; padding:0 8px}

  /* ── entrance animations: each screen "comes alive" as it rotates in ──
     Items are rebuilt every rotation (renderCurrent) so this replays each time;
     `--i` (set per item in the renderers) staggers them. GPU-cheap for the TV. */
  @keyframes tvIn{ from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
  .panel[data-panel="bins"] .bb-group,
  .panel[data-panel="schedule"] .day,
  .panel[data-panel="schedule"] .rname,
  .panel[data-panel="schedule"] .cell{ animation:tvIn .55s both; animation-delay:calc(var(--i,0) * 55ms) }
  .panel[data-panel="bins"] .bb-row{ animation:tvIn .5s both; animation-delay:calc(var(--i,0) * 45ms + 120ms) }
  /* Operations lanes arrive one after another like the bins rows.
     :not(.beat) matters — a lane that beat last year owns its animation slot for
     the celebrate pulse, and stealing it would kill the thing worth watching. */
  .panel[data-panel="kpis"] .opsl:not(.beat){ animation:tvIn .55s both; animation-delay:calc(var(--i,0) * 95ms + 150ms) }
  /* The heading's own entrance (pHeadBar / pHeadIn) is gone with .p-head — there
     is no per-panel heading left to animate in. The top block it moved into is
     permanent chrome and holds still between screens on purpose. */
  /* Truck wipe, once per full lap. It drives RIGHT TO LEFT because the artwork
     faces left — flipping it would mirror the JEFF'S JUNK.ca sign into gibberish
     — and that happens to run with the outgoing panel, which rides off left too.
     Two elements: .rig drives, the img bobs, because one element cannot animate
     transform two ways at once. */
  #tvWipe{position:absolute; inset:0; z-index:40; pointer-events:none; overflow:hidden; display:none}
  #tvWipe.go{display:block}
  #tvWipe .rig{position:absolute; bottom:7%; left:100%;
    animation:truckWipe 1.7s cubic-bezier(.42,0,.4,1) both}
  #tvWipe .rig img{display:block; width:360px; animation:bob .45s ease-in-out infinite;
    filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
  @keyframes truckWipe{ from{transform:translateX(0)} to{transform:translateX(-128vw)} }
  /* crew grid is a fixed 7-column grid (name + Mon–Sat) — stagger columns L→R */
  #schedWrap > :nth-child(7n+2){--i:1} #schedWrap > :nth-child(7n+3){--i:2}
  #schedWrap > :nth-child(7n+4){--i:3} #schedWrap > :nth-child(7n+5){--i:4}
  #schedWrap > :nth-child(7n+6){--i:5} #schedWrap > :nth-child(7n+7){--i:6}

  /* ── Screen 3 · Operations — "Beat Last July" scoreboard ── */
  @keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  /* a lane that has already beaten last year keeps its card shadow and gains a
     gold edge that breathes — the old version replaced the shadow outright and
     the lane visibly dropped off the board once a month */
  @keyframes celebrate{
    0%,100%{box-shadow:var(--card-lift), inset 0 0 0 3px rgba(226,195,100,.85)}
    50%{box-shadow:var(--card-lift), inset 0 0 0 3px rgba(226,195,100,.85), 0 0 46px rgba(226,195,100,.34)}
  }
  @keyframes glowPulse{0%,100%{box-shadow:0 0 0 rgba(226,195,100,0)}50%{box-shadow:0 0 36px rgba(226,195,100,.6)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  /* Bins-out pill. renderKpis writes it into #kpiMeta, which lives in the now
     hidden .p-head; the page script mirrors that panel's tag into #toppill, so
     the pill is styled for both homes and looks the same in either. */
  #kpiMeta .binsout, #toppill .binsout{display:inline-flex; align-items:baseline; gap:14px;
    vertical-align:middle}
  #kpiMeta .binsout b, #toppill .binsout b{font:900 54px/1 Inter; color:var(--gold);
    font-variant-numeric:tabular-nums}
  #kpiMeta .binsout span, #toppill .binsout span{font:600 20px/1.2 Inter;
    letter-spacing:.14em; text-transform:uppercase; color:#efe6c3}

  /* ── 2A standings lanes (default) ── */
  #kpiGrid{height:100%; display:flex; flex-direction:column; gap:22px}
  .opsl{position:relative; flex:1 1 0; min-height:0; display:flex; align-items:stretch;
    background:var(--card-fill); border:1px solid var(--card-line); border-radius:24px;
    box-shadow:var(--card-lift); overflow:hidden}
  .opsl.beat{animation:celebrate 2.6s ease-in-out infinite}
  .opsl .accent{width:14px; flex:0 0 auto}
  .opsl .who{flex:0 0 430px; display:flex; flex-direction:column; justify-content:center; gap:10px; padding:20px 30px}
  .opsl .who .nm{font:900 42px/1 Inter; color:var(--cream); letter-spacing:-.02em; white-space:nowrap}
  .opsl .who .beatchip{align-self:flex-start; font:900 18px/1 Inter; color:var(--ink);
    background:var(--gold); border-radius:11px; padding:6px 13px}
  /* the ▲/▼ percentage takes its colour inline from the renderer; 22px/800 keeps
     it in "large text" territory, where those two hues clear 3:1 on the card */
  .opsl .who .pc{font:800 22px/1.25 Inter; white-space:nowrap}
  .opsl .who .pc.up{color:#8fd6a5}
  .opsl .who .pc.down{color:#f0a884}
  .opsl .who .pc em{color:var(--muted); font-weight:500; font-style:normal; font-size:18px}
  .opsl .mid{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:18px; padding:18px 30px 18px 6px}
  .opsl .mid .big{display:flex; align-items:baseline; gap:14px}
  .opsl .mid .big .n{font:900 96px/.82 Inter; font-variant-numeric:tabular-nums}
  .opsl .mid .big .lab{font:800 22px/1.15 Inter; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted)}
  .opsl .bar{position:relative; height:28px; background:rgba(243,233,201,.09); border-radius:999px; margin:2px 0}
  .opsl .bar .fill{position:absolute; left:0; top:0; bottom:0; border-radius:999px; z-index:2; transform-origin:left; animation:growX 1s ease .1s both}
  /* the projection is the SAME bar continuing, so it stays open on its left edge
     — a closed pill there would read as a second, separate measurement */
  .opsl .bar .ghost{position:absolute; top:0; bottom:0; border:2px dashed; border-left:none; border-radius:0 999px 999px 0; z-index:1}
  .opsl .bar .tick{position:absolute; top:-9px; bottom:-9px; width:4px; background:var(--cream); border-radius:2px; z-index:3}
  .opsl .bar .tl{position:absolute; bottom:-27px; transform:translateX(-50%); font:700 16px/1 Inter; color:var(--muted); white-space:nowrap}
  .opsl .bar .pl{position:absolute; top:-26px; transform:translateX(-50%); font:800 16px/1 Inter; white-space:nowrap}
  .opsl .verd{flex:0 0 300px; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:11px; padding:20px 30px 20px 0}
  .opsl .verd .pill{font:900 28px/1 Inter; border-radius:999px; padding:11px 22px; white-space:nowrap; letter-spacing:.03em}
  .opsl .verd .pill.ok{background:var(--done-bg); color:var(--done-fg)}
  .opsl .verd .pill.no{background:#7a3a2a; color:#f6d2c2}
  /* The verdict line takes its colour INLINE from the renderer — a mid green or a
     dark gold, both chosen for the old cream board and neither legible on a dark
     card. Nothing in a stylesheet can outrank an inline colour by fair means, so
     the line gets its old ground back as a small plate instead; both hues clear
     3:1 on it at this size. Change the renderer and this plate can go. */
  /* The verdict line used to carry an inline colour picked for the cream board,
     which needed a pale plate behind it to survive on a dark card. The renderer
     now sets .ok / .no instead and the colour is chosen here, against this
     palette — so the plate is gone and the text just reads. */
  .opsl .verd .sub{font:700 21px/1.2 Inter; text-align:right; white-space:nowrap}
  .opsl .verd.ok .sub{color:#8fd6a5}
  .opsl .verd.no .sub{color:#f0b877}

  /* ── 2B race arena (celebration takeover) ──
     Already a dark screen before the restyle, so it needed the least work: the
     spruce gradient becomes the board's own ground, and the dot texture becomes
     the terrain photograph so the takeover reads as the same world zoomed in. */
  .opsa{height:100%; display:flex; flex-direction:column; position:relative; overflow:hidden; padding:30px 56px 26px;
    background:linear-gradient(160deg, rgba(30,44,32,.92), rgba(13,20,15,.96));
    border:1px solid var(--card-line); border-radius:24px; box-shadow:var(--card-lift)}
  .opsa::before{content:""; position:absolute; inset:0; opacity:.16; mix-blend-mode:overlay;
    background:var(--terrain) center/cover}
  .opsa-head{position:relative; display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
  .opsa-head .t{font:900 36px/1 Inter; letter-spacing:-.02em; color:var(--cream); white-space:nowrap}
  .opsa-head .lg{font:800 19px/1 Inter; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
  .opsa-field{position:relative; flex:1 1 auto}
  .opsa-line{position:absolute; left:0; right:0; top:26%; border-top:3px dashed var(--gold); z-index:4}
  .opsa-line .fin,.opsa-line .last{position:absolute; top:-16px; font:900 17px/1 Inter; letter-spacing:.12em;
    color:var(--ink); background:var(--gold); border-radius:9px; padding:5px 13px; white-space:nowrap}
  .opsa-line .fin{left:0}.opsa-line .last{right:0}
  .opsa-cols{position:absolute; left:0; right:0; top:0; bottom:118px; display:flex; justify-content:space-around; align-items:flex-end}
  .opsa-caps{position:absolute; left:0; right:0; bottom:0; height:104px; display:flex; justify-content:space-around}
  .opsa-col{position:relative; flex:0 0 260px; height:100%; display:flex; justify-content:center; align-items:flex-end}
  .opsa-fx{position:absolute; top:1%; font-size:32px; animation:bob 2.2s ease-in-out infinite}
  .opsa-track{position:relative; width:150px; height:100%; background:rgba(243,233,201,.08); border-radius:18px}
  .opsa-fill{position:absolute; left:0; right:0; bottom:0; border-radius:16px; transform-origin:bottom; animation:growY 1.1s ease .15s both}
  .opsa-fill.beat{animation:growY 1.1s ease .15s both,glowPulse 2.4s ease-in-out infinite}
  .opsa-ghost{position:absolute; left:0; right:0; border:2px dashed; border-bottom:none; border-radius:14px 14px 0 0}
  .opsa-projlab{position:absolute; left:0; right:0; text-align:center; transform:translateY(-9px); font:800 17px/1 Inter}
  .opsa-num{position:absolute; left:0; right:0; text-align:center; transform:translateY(-12px); font:900 62px/1 Inter; font-variant-numeric:tabular-nums}
  .opsa-num.top{top:5%; transform:none}
  .opsa-num .bt{font:900 22px/1 Inter; color:var(--ink); letter-spacing:.04em; margin-bottom:4px}
  .opsa-col-cap{flex:0 0 260px; text-align:center}
  .opsa-col-cap .nm{font:900 30px/1 Inter; letter-spacing:-.02em; color:var(--cream)}
  .opsa-col-cap .vs{font:500 18px/1.3 Inter; color:var(--muted); margin-top:6px}
  .opsa-col-cap .vd{font:800 19px/1.2 Inter; margin-top:6px}

  /* ── Screen 4 · Trucks on the Road — live Geotab map + today's pulse ──
     Positions are READ-ONLY (geotab-proxy `device-status`, the same feed the
     dashboard's Live Jobs map uses). The TV never writes to jobs or MyGeotab. */
  #opsWrap{height:100%; display:flex; min-height:0}
  /* No card. A photograph cannot track a live map — it is a picture of nowhere
     in particular and it cannot survive the tour's zoom range — so rather than
     try to line two grounds up, this screen only has one: the map fills the
     stage edge to edge and the chips float on it. */
  /* Opaque, in the map's own ground colour. Dropping the card fill entirely let
     the terrain photograph show through in the seconds before Google paints its
     first tiles, which reads as a hole in the board rather than a map loading. */
  .lo-card{position:relative; flex:1 1 auto; background:#36432f; border:0;
    border-radius:0; box-shadow:none;
    overflow:hidden; display:flex; flex-direction:column; min-height:0}
  /* The map's own colours are set by MAP_STYLE in the page script, NOT by a CSS
     filter here. A filter could only tint the finished picture — it dimmed the
     labels along with everything else, which is why road names read so faintly
     before. Google restyles the map itself, so the roads stay pale and the labels
     stay crisp. Google's own attribution is left alone on purpose: hiding it
     breaks the terms of use.
     MAP_STYLE now puts the map in the terrain palette, so the overlays below sit
     on a DARK map: dark plate, cream type, same language as the rest of the board.
     One thing that cannot be changed from anywhere: Google composites the live
     traffic INTO the same tile image as the base map — every tile in the viewport
     carries both — so the traffic lines cannot be dimmed or restyled separately.
     Fading them fades the whole map. Traffic is on or off, nothing in between. */
  #tvmap{flex:1 1 auto; min-height:0; background:#36432f; font-family:Inter,sans-serif;
    transition:opacity .34s ease}
  /* A jump to a different zoom can't be tweened on this map, so it lands as a
     snap. .cut blacks the panel out instantly, the jump happens where nobody can
     see it, and removing the class fades the new view up — a deliberate cut
     rather than a lurch. Only the map dips; the legend and town chip are its
     siblings, so they hold steady through it. */
  #tvmap.cut{opacity:0; transition:none}
  /* Pins and cards are our own HTML laid over the map, so they must not swallow
     clicks meant for it — and on a wall nothing is clicked anyway. The overlays
     are absolutely-positioned siblings, so DOM order alone would decide what
     covers what; these say it outright instead. A truck always beats a job pin. */
  #tvmap .lo-mk-yard, #tvmap .lo-mk-job, #tvmap .lo-mk-truck, #tvmap .lo-pop{pointer-events:none}
  .lo-mk-yard{z-index:1}
  /* A town can carry work, bins going out and bins coming back, so this marker is a
     ROW of chips rather than a single one. htmlMarker centres the div on the town,
     and a flex row measures its own width, so the group stays centred whether the
     town has one chip or three. */
  .lo-mk-job{z-index:2; display:flex; align-items:center; gap:6px}
  .lo-mk-truck{z-index:3}
  .lo-pop{z-index:4}
  /* Truck pin — a glossed disc, a ring PAIR, a name chip, and a ping ring while
     it's moving. Two rings, not one: cream first, because that is what lifts the
     disc off a pale map, then a near-solid dark one outside it, because the discs
     are green, amber and red and so are Google's traffic lines directly under
     them. A road is a flat stroke; a ringed 45px disc is not, and that difference
     is what the eye picks out at wall distance, not the hue. */
  @keyframes tkping{0%{transform:scale(.7);opacity:.85}100%{transform:scale(2.1);opacity:0}}
  .lo-tk{position:relative; display:flex; flex-direction:column; align-items:center; gap:5px}
  .lo-tk .b{position:relative; display:grid; place-items:center; width:45px; height:45px; border-radius:50%;
    box-shadow:0 9px 24px rgba(0,0,0,.38), 0 0 0 6px var(--plate), 0 0 0 10px rgba(20,29,17,.82)}
  /* --glyph comes from TRUCK_GLYPH, set inline beside the disc colour, so the two
     are always picked together. A light disc needs a dark truck. */
  .lo-tk .b svg{width:24px; height:24px; stroke:var(--glyph); fill:none; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round}
  .lo-tk .ping{position:absolute; inset:-8px; border-radius:50%; border:3px solid currentColor;
    animation:tkping 1.7s ease-out infinite; pointer-events:none}
  .lo-tk .n{background:rgba(17,24,18,.92); border:1px solid var(--card-line); border-radius:9px;
    padding:4px 11px; font:900 16px/1.15 Inter;
    color:var(--cream); white-space:nowrap; box-shadow:0 3px 12px rgba(0,0,0,.35)}
  /* the truck the map is currently focused on */
  .lo-tk.sel .b{width:57px; height:57px}
  .lo-tk.sel .b svg{width:30px; height:30px}
  .lo-yard{width:22px; height:22px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 0 4px var(--plate), 0 4px 10px rgba(0,0,0,.35)}
  /* Today's work, pinned by town. Deliberately unlike a truck pin — no pale ring
     around a coloured disc, no gloss, no name chip — so a glance never reads
     "there is work here" as "a truck is here". The number is what is LEFT to do
     in that town. Its fill is var(--spruce) because the legend swatch the script
     builds uses that same property; the two must not drift apart. */
  .lo-job, .lo-bin{display:flex; align-items:center; justify-content:center; min-width:36px; height:36px;
    padding:0 11px; border-radius:13px; color:var(--cream);
    font:900 20px/1 Inter; border:3px solid var(--plate);
    box-shadow:0 5px 14px rgba(0,0,0,.32)}
  .lo-job{background:var(--spruce)}
  .lo-job.done{background:rgba(30,44,32,.55)}
  /* Today's bin legs, in the same chip as the work pin so a town reads as one
     group. Blue is a drop-off, pink is a pick-up (Jake, 2026-09-09) — deliberately
     the SAME two colours the bins screen already puts on its Drop/Pick chips
     (.bb-kind.k-drop / .k-pick), so the two screens on this wall speak one
     language. Done fades rather than swapping fill: a second fill for each would
     put four colours on one pin to say something the tick already says. */
  .lo-bin.drop{background:var(--drop-bg)}
  .lo-bin.pick{background:var(--pick-bg)}
  .lo-bin.done{opacity:.5}
  /* Focused-truck card. An HTML overlay pinned above the truck, so it rides with
     the pin — there's no cursor on a wall, so nothing could ever hover it.
     It sits on the PALE map, so the card fill is pushed near-opaque: the board's
     .74/.86 translucency would let cream through and take the body rows below
     4.5:1. Same two colours, just less see-through. */
  .lo-pop{white-space:normal}
  .lo-pop .card{width:250px; border-radius:15px; overflow:hidden;
    background:linear-gradient(180deg, rgba(25,33,25,.95), rgba(17,24,18,.97));
    border:1px solid var(--card-line); box-shadow:0 16px 38px rgba(0,0,0,.42)}
  /* The header's background is the truck's live status colour, written inline
     (green / amber / red). White type on those is 2.3 / 2.1 / 3.4:1 — it
     failed on the old board too. Dark ink reads 7.1 / 7.5 / 4.8:1, and is the
     only half of the pair this sheet can still choose. */
  .lo-pop .hd{display:flex; align-items:center; gap:10px; padding:10px 15px}
  .lo-pop .hd .nm{font:900 23px/1 Inter; letter-spacing:-.02em; color:var(--ink)}
  .lo-pop .hd .st{margin-left:auto; font:900 12px/1 Inter; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink); background:rgba(255,255,255,.42);
    border-radius:20px; padding:5px 11px}
  .lo-pop .rw{display:flex; justify-content:space-between; align-items:baseline; gap:16px;
    padding:8px 15px 0; font:500 16px/1.2 Inter; color:var(--muted)}
  .lo-pop .rw:last-child{padding-bottom:12px}
  .lo-pop .rw b{color:var(--cream); font-weight:900}
  /* jobs-left progress */
  .lo-pop .bar{height:9px; border-radius:5px; background:rgba(243,233,201,.14); overflow:hidden; margin:7px 15px 0}
  .lo-pop .bar i{display:block; height:100%; border-radius:5px}
  .lo-pop .cap{font:500 13px/1 Inter; color:var(--muted); text-align:right; margin:6px 15px 0}
  /* Legend sits ON the map, bottom-left. It can't live in the panel head — that
     head is hidden now, and even before it was, the ambient truck/bin art
     (#tvtruck/#tvbin, z-index 5) was parked over that exact spot and buried it. */
  #loLegend{position:absolute; left:20px; bottom:20px; z-index:400; display:flex; gap:22px;
    background:rgba(17,24,18,.88); border:1px solid var(--line); border-radius:16px; padding:13px 20px;
    box-shadow:0 6px 18px rgba(0,0,0,.4)}
  #loLegend b{display:flex; align-items:center; gap:10px; font:600 19px/1 Inter;
    color:#efe6c3; white-space:nowrap}
  #loLegend i{width:15px; height:15px; border-radius:50%}
  /* where the highlighted truck is, top-right of the map */
  #loTown{position:absolute; right:20px; top:20px; z-index:400; display:none; align-items:center; gap:12px;
    background:rgba(17,24,18,.88); border:1px solid var(--line); border-radius:16px; padding:12px 20px;
    box-shadow:0 6px 18px rgba(0,0,0,.4)}
  #loTown.on{display:flex}
  #loTown .k{font:800 14px/1 Inter; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-line)}
  #loTown .v{font:900 30px/1 Inter; letter-spacing:-.02em; color:var(--cream)}

  /* today's job counts. Written into the hidden panel head; styled here so the
     colour is right if the script ever mirrors it up beside the title. */
  #loCount{color:var(--gold-line)}

  /* ── bottom strip. Bins out and trucks rolling are true whichever screen is up,
     so they sit outside the rotation and stay on the wall all day. Full-bleed
     across the board's side padding, with a hairline the mockup's footer uses to
     part it from the terrain. ── */
  #botbar{flex:0 0 auto; margin:0 -40px; padding:0 40px; height:96px;
    display:flex; align-items:center; gap:32px;
    border-top:1px solid rgba(237,225,185,.15);
    background:linear-gradient(180deg, rgba(18,25,19,.12), rgba(17,24,18,.48))}
  #botbar .fm{display:flex; align-items:baseline; gap:16px}
  #botbar .fm b{font:900 62px/.9 Inter; color:var(--cream); font-variant-numeric:tabular-nums}
  #botbar .fm span{font:500 21px/1 Inter; letter-spacing:.22em; text-transform:uppercase; color:#efe6c3}
  #botbar .fsep{width:1px; height:52px; background:rgba(238,226,184,.25)}
  #botbar .fspace{flex:1 1 auto}
  #botbar .fwhere{font:500 21px/1 Inter; letter-spacing:.18em; text-transform:uppercase; color:#ece3bf}

  /* ── 9 AM briefing — voice-over only (Jake: the board keeps doing its normal
     thing). The ONLY visual is this small note, shown when the browser REFUSES
     the audio: a silent failure with no trace would be indistinguishable from
     the feature not existing. ── */
  #brief{position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:80;
    display:none; align-items:center; gap:12px; background:rgba(17,24,18,.94);
    border:1px solid var(--card-line); border-radius:16px;
    padding:14px 22px; box-shadow:0 10px 26px rgba(0,0,0,.5)}
  #brief.on{display:flex}
  #brief .warn{font:600 17px/1.35 Inter; color:#f0b877}

  /* ── net-status pip ── */
  #netdot{position:fixed; bottom:14px; right:14px; width:12px; height:12px; border-radius:50%;
    background:#6fbf8a; opacity:.5; transition:background .3s, opacity .3s; z-index:50}
  #netdot.bad{background:var(--alert-b); opacity:1}
</style>
</head>
<body>
  <!-- Startup / Standby — shown on boot, reconnect, or a hard failure -->
  <div id="gate">
    <div class="gate-dots" aria-hidden="true"></div>
    <div class="gate-spin" id="gateSpin"></div>
    <img class="gate-truck" src="assets/tv-truck.png" alt="Jeff's Junk truck">
    <div class="gate-h">Warming up the board…</div>
    <div class="gate-sub" id="gateMsg">Reconnecting to dispatch — hang tight</div>
    <div class="gate-pulse"><span></span><span></span><span></span></div>
    <div class="gate-foot"><img src="assets/jeffs-junk-logo.png" alt=""><span>Office Board · Barrie, ON</span></div>
  </div>

  <div id="viewport">
    <div id="board">
      <!-- shared header -->
      <div id="topbar">
        <div id="brand">
          <div><div class="brand-name">Jeff's Junk</div>
            <div class="brand-sub" id="brandSub">Office Board</div></div>
        </div>
        <div id="toppill"></div>
        <div id="tright">
          <div id="wx"><span class="i" id="wxI"></span><span class="t" id="wxT"></span><span class="hl" id="wxHL"></span></div>
          <div id="clock"><div class="t" id="clockT">–</div><div class="d" id="clockD">–</div></div>
        </div>
      </div>


      <div id="stage">
        <!-- Screen 1 · Bin Work Today -->
        <section class="panel" data-panel="bins">
          <div class="p-head"><span class="bar"></span><h2>Bin Work Today</h2>
            <span class="tag" id="binsTag"></span><span class="spacer"></span><span class="status" id="binsMeta"></span></div>
          <div class="p-body"><div id="binsWrap"></div></div>
        </section>

        <!-- Screen 2 · Crew · This Week -->

        <!-- Screen 3 · Operations -->
        <section class="panel" data-panel="kpis">
          <div class="p-head"><span class="bar"></span><h2>Operations</h2>
            <span class="spacer"></span><span class="status" id="kpiMeta"></span></div>
          <div class="p-body"><div id="kpiGrid"></div></div>
        </section>

        <!-- Screen 4 · Trucks on the Road -->
        <section class="panel" data-panel="liveops">
          <div class="p-head"><span class="bar"></span><h2>Trucks on the Road</h2>
            <span class="tag" id="loTag"></span><span class="status" id="loCount"></span>
            <span class="spacer"></span><span class="status" id="loMeta"></span></div>
          <div class="p-body"><div id="opsWrap">
            <div class="lo-card"><div id="tvmap"></div><div id="loLegend"></div>
              <div id="loTown"></div><div id="loRail"></div></div>
          </div></div>
        </section>

        <!-- Once-a-lap truck wipe. Same artwork as the ambient #tvtruck, so it is
             already cached and costs no extra download. -->
        <div id="tvWipe" aria-hidden="true"><span class="rig"><img src="assets/tv-truck.png" alt=""></span></div>
      </div>

      <!-- Bottom strip. Bins out and trucks rolling are true whichever screen is
           up, so they sit outside the rotation and stay on the wall all day. -->
      <footer id="botbar">
        <div class="fm"><b id="fBins">0</b><span>Bins out</span></div>
        <div class="fsep"></div>
        <div class="fm"><b id="fTrucks">0</b><span>Trucks rolling</span></div>
        <div class="fspace"></div>
        <div class="fwhere">Barrie / Simcoe County / Ontario</div>
      </footer>
    </div>
  </div>
  <!-- 9 AM briefing is voice-over only. This note appears solely when the
       browser refuses to play the audio, so a failure is never invisible. -->
  <div id="brief"><span class="warn" id="briefWarn"></span></div>

  <div id="netdot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    "use strict";

    // ── config ──────────────────────────────────────────────────────────────
    var SUPABASE_URL = 'https://okoqzbdyfjfgcdgmcamq.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_zN3Npl7I-6qUjilF_fhLnQ_5aMtilJk';
    var DISPLAY_EMAIL = 'officetv@jeffsjunk.ca';   // ONLY this account may view the board
    var ROTATE_MS  = 20000;   // default time each panel is shown
    // The map screen still earns a little extra — it is the one people walk up to and
    // stand in front of, "where is everyone" being the question the board gets asked —
    // but nothing like the time it used to need. 110s was sized for a camera that flew
    // to every truck and replayed its path; a still map with the whole crew on it is
    // read in seconds, and holding the wall on it for two minutes was showing the same
    // picture over and over (Jake, 2026-09-09). One lap of the highlight is enough.
    // Everything else stays at ROTATE_MS.
    var PANEL_MS   = { liveops: 30000 };
    function panelMs(name){ return PANEL_MS[name] || ROTATE_MS; }
    var REFRESH_MS = 900000;  // how often data is refetched (15 min — keeps Supabase egress low; panels still rotate every 20s so the board stays lively)
    // The weekly crew schedule came off the wall on 2026-09-06 (Jake: "we don't
    // need it anymore"). The data behind it still loads — workingTodayCount()
    // reads the same rows for the Operations screen.
    var PANELS = ['bins','kpis','liveops'];
    // 92 Davidson St — home base. Re-geocoded 2026-09-05: the old point (44.3683,
    // -79.6831) was Tower Crescent, 4 km south, so every truck parked at the depot
    // counted as OUT — "5 of 5 out" all night, and the overview framed the depot
    // alongside whoever was really working, which is why it always sat zoomed out.
    var YARD = { lat:44.4040, lng:-79.6911 };
    var YARD_KM = 0.6;                          // inside this ring a truck reads "at the yard"
    // How close the all-trucks frame may go. Only bites when the crew is clustered
    // tight enough — or down to one truck — that fitBounds would otherwise pick
    // street level. There is no per-truck zoom any more: the map picks this one
    // frame and keeps it, so nothing ever asks Google for a fresh tile level
    // mid-showing.
    //
    // 16 was right when the camera flew in on each truck and the close view was the
    // point. It is wrong for a frame that has to stand still and answer "where is
    // everyone": one truck out collapsed the bounds to a point and slammed the wall
    // to a 3 km view of a single pin with no landmark near it, which tells the
    // office nothing about where that is. 14 is roughly 13 km across — the whole of
    // Barrie and the country around it, so a lone truck is somewhere recognisable.
    var MAX_FRAME_ZOOM = 14;
    var WEEKDAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

    // Dedicated session store so this page can NEVER pick up a staff member's
    // dashboard session in the same browser — it only ever runs as the display user.
    var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth:{ storageKey:'jj-office-tv-auth', persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
    });

    // ── date helpers (all local time) ────────────────────────────────────────
    function pad2(n){ return String(n).padStart(2,'0'); }
    function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
    function todayStr(){ return ymd(new Date()); }
    function mondayStr(){
      var d = new Date(); var g = d.getDay();            // 0=Sun..6=Sat
      d.setDate(d.getDate() + (g===0 ? -6 : 1-g));       // back to Monday
      return ymd(d);
    }
    function todayWeekday(){ return WEEKDAYS[(new Date().getDay()+6)%7]; }
    // When the shop is shut, the board pulls nothing — no Supabase, no Geotab.
    // Open hours are Mon–Fri 7 AM–7 PM and Sat 7 AM–2 PM; everything else is quiet.
    //
    // This used to cover the weekend only, which left the board polling every 105
    // seconds all night on weeknights, for trucks parked in the yard. That was
    // roughly half of all polling, done for an empty office: a measured 36 KB per
    // trails call adds up to ~700 MB/month of Supabase egress, and busy days would
    // triple it against a 5 GB free-tier budget. Closing the nights cuts it ~45%
    // and costs nothing, since nobody is watching.
    //
    // (Boot still loads once, so a restart at 2 AM isn't a blank board.)
    function inQuietHours(){
      var n = new Date(), d = n.getDay(), h = n.getHours();
      if(d === 0) return true;             // Sunday
      if(h < 7) return true;               // before 7 AM, any day
      if(d === 6) return h >= 14;          // Saturday winds up at 2 PM
      return h >= 19;                      // weeknights after 7 PM
    }
    function fmt12(t){                                    // "7:00" -> "7a", "19:00" -> "7p"
      if(!t) return '';
      if(String(t)==='anytime') return 'Anytime';
      var p = String(t).split(':'); var h = parseInt(p[0],10); if(isNaN(h)) return t;
      var ap = h>=12 ? 'p':'a'; var hh = h%12; if(hh===0) hh=12;
      var m = p[1] && p[1]!=='00' ? ':'+p[1] : '';
      return hh+m+ap;
    }
    function fmt12ap(t){                                  // "7:00" -> "7am", "16:00" -> "4pm"
      if(!t) return '';
      if(String(t)==='anytime') return 'Anytime';
      var p = String(t).split(':'); var h = parseInt(p[0],10); if(isNaN(h)) return t;
      var ap = h>=12 ? 'pm':'am'; var hh = h%12; if(hh===0) hh=12;
      var m = p[1] && p[1]!=='00' ? ':'+p[1] : '';
      return hh+m+ap;
    }

    // ── Operations scoreboard: working-day pace (Mon–Sat) ─────────────────────
    function workingDaysBetween(start, end){                 // Mon–Sat in [start,end)
      var n=0, d=new Date(start);
      while(d < end){ if(d.getDay()!==0) n++; d.setDate(d.getDate()+1); }
      return n;
    }
    function paceProject(soFar){                              // month-so-far → projected month-end
      var now=new Date(), y=now.getFullYear(), m=now.getMonth();
      var elapsed=Math.max(1, workingDaysBetween(new Date(y,m,1), new Date(y,m,now.getDate()+1)));
      var total  =Math.max(elapsed, workingDaysBetween(new Date(y,m,1), new Date(y,m+1,1)));
      return Math.round(soFar * total / elapsed);
    }
    // How long the arena takes over after a FRESH beat. 0 = never (2A only).
    var BEAT_CELEBRATE_MS = 6*60*1000;                        // 6 minutes
    // True while a newly-crossed "beat last year" is still inside its window.
    function beatCelebrationActive(services){
      var now=Date.now(), monthKey=new Date().toISOString().slice(0,7), key='jj-tv-beat';
      var st; try{ st=JSON.parse(localStorage.getItem(key)||'{}'); }catch(e){ st={}; }
      if(st.month!==monthKey) st={month:monthKey, seen:[], until:0};
      var beaters=services.filter(function(s){ return s.last>0 && s.cur>=s.last; })
                          .map(function(s){ return s.name; });
      var fresh=beaters.filter(function(n){ return st.seen.indexOf(n)===-1; });
      if(fresh.length){ st.until=now+BEAT_CELEBRATE_MS; st.seen=beaters; }
      try{ localStorage.setItem(key, JSON.stringify(st)); }catch(e){}
      return now < (st.until||0);
    }
    // Count-up numbers from 0 (replays each rotation/refresh since the panels rebuild).
    // Animates any LEAF element whose text is a plain integer — used on the Operations
    // and Bin Work screens.
    function countUp(root){
      var nums = [].slice.call(root.querySelectorAll('*')).filter(function(el){
        return el.children.length===0 && /^\d+$/.test((el.textContent||'').trim());
      });
      // requestAnimationFrame is PAUSED while the tab is hidden, so if we zeroed
      // the numbers now they'd stick at 0 until the tab is visible again — the
      // board would read "0 of 0 done". The count-up is only eye-candy, so when
      // hidden just leave the real values on screen and skip the animation.
      if(document.hidden){ return; }
      nums.forEach(function(el, i){
        var target = parseInt(el.textContent, 10), dur = 850, delay = 120 + i*55, start = null;
        el.textContent = '0';
        function tick(ts){
          if(start == null) start = ts;
          var p = (ts - start - delay) / dur;
          if(p < 0){ requestAnimationFrame(tick); return; }
          if(p >= 1){ el.textContent = String(target); return; }
          el.textContent = String(Math.round(target * (1 - Math.pow(1 - p, 3))));  // easeOutCubic
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        // Safety net: setTimeout keeps firing even when rAF is throttled/paused
        // (e.g. the tab gets hidden mid-animation), so the real number always lands
        // and the board can never get stuck showing 0.
        setTimeout(function(){ el.textContent = String(target); }, delay + dur + 400);
      });
    }

    // ── DOM helpers ──────────────────────────────────────────────────────────
    function el(id){ return document.getElementById(id); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function parseLocal(s){ var p=String(s).split('-'); return new Date(+p[0], (+p[1])-1, +p[2]); } // avoid UTC shift

    // ── state ────────────────────────────────────────────────────────────────
    var DATA = { jobs:[], crew:{}, crewColor:{}, jwgColor:{}, emps:[], sched:{}, tasks:{},
                 inv:[], cats:{}, kpi:{}, junk:{}, binBoard:[], trucks:[], trucksAt:0,
                 crewAll:{}, trails:{}, trailsAt:0, truckDriver:{} };
    var panelIdx = 0, rotTimer = null;

    function jobTime(j){
      var s=j.service;
      if(s==='Furniture Pickup'||s==='Furniture Delivery') return j.fb_time || j.time || '';
      if(s==='Junk Removal'||s==='Junk Quote'||s==='Extra Jobs') return j.junk_time || j.time || '';
      return j.time || j.junk_time || j.fb_time || '';
    }
    function timeMins(t){ if(!t||t==='anytime') return 99999; var p=String(t).split(':'); return parseInt(p[0],10)*60+(parseInt(p[1],10)||0); }
    // the day a job actually happens on (junk/landscaping reschedule via junk_date, furniture via fb_date)
    function effDay(j){
      var s=j.service;
      if(s==='Furniture Pickup'||s==='Furniture Delivery') return j.fb_date || j.date;
      if(s==='Junk Removal'||s==='Junk Quote'||s==='Extra Jobs') return j.junk_date || j.date;
      return j.date;
    }
    // today's board entries — bins split into their drop-off / pick-up legs on the LEG day
    // `kind` is 'drop', 'pick' or null (everything that is not a bin leg). The map
    // pins read it to colour a bin blue or pink; nothing else looks at it.
    //
    // A bin leg's done/not-done comes from the GEOFENCE, exactly as the bin board's
    // does (Jake 2026-07-07) - a leg crosses off from truck-GPS zone visits only,
    // never the job's own flag. It has to be the same rule: the bins screen and the
    // map hang on the same wall, and two different answers for the same bin is worse
    // than either. The job's `completed` covers the WHOLE rental anyway, so a bin
    // dropped this morning would have read "still to do" until it was collected days
    // later. Everything that is not a bin leg still counts as left until the job
    // itself is marked completed.
    function buildTodayEntries(rows, today, notifRows){
      var out=[], geo={dropped:{}, pickedup:{}};
      (notifRows||[]).forEach(function(n){ if(geo[n.status]) geo[n.status][n.job_id]=1; });
      rows.forEach(function(j){
        if(j.status==='Cancelled') return;
        // Not real Jeff's Junk jobs: quotes aren't jobs, landscaping is the JWG side.
        if(j.service==='Junk Quote' || j.service==='Extra Jobs') return;
        function mk(label, time, crewIds, kind, done){
          out.push({ service:label, time:time||'', name:j.name, business_name:j.business_name,
                     address:j.address, city:j.city, crewIds:(crewIds||[]).filter(Boolean),
                     kind:kind||null, completed: !!done });
        }
        if(j.service==='Bin Rental'){
          var picked = !!geo.pickedup[j.job_id];
          if(j.bin_dropoff===today) mk('Bin Drop-off', j.bin_dropoff_time, [j.dropoff_crew_id],
                                       'drop', picked || geo.dropped[j.job_id]);
          if(j.bin_pickup===today)  mk('Bin Pick-up',  j.bin_pickup_time,  [j.pickup_crew_id],
                                       'pick', picked);
        } else if(effDay(j)===today){
          mk(j.service, jobTime(j), [].concat(j.assigned_crew_ids||[]), null, j.completed);
        }
      });
      return out.sort(function(a,b){ return timeMins(a.time)-timeMins(b.time); });
    }
    // Today's bin legs grouped by driver. Done/not-done is GEOFENCE-ONLY (Jake
    // 2026-07-07): a leg crosses off purely from truck-GPS zone visits
    // (geofence_notifications), NOT the job's bin_instatus. The TV never calls
    // Geotab. A drop leg counts as done on a zone visit (dropped OR pickedup
    // notif = the truck was there); a pick leg once the truck has left (pickedup).
    // Who is in which truck today, read off the trucks themselves: every zone visit
    // names a device and a job, and the job's leg for today names a driver. The
    // driver a truck is seen with most is its driver — so when two people swap
    // trucks it shows on the pin by the second stop, with nobody typing anything.
    // Until a truck has stood in a zone the regular pairing (TRUCK_DRIVERS) holds.
    function buildTruckDrivers(rows, visits, today){
      var byJob = {};
      rows.forEach(function(j){ byJob[j.job_id] = j; });
      var tally = {};
      (visits||[]).forEach(function(v){
        var j = byJob[v.job_id];
        if(!j) return;
        var crewId = (j.bin_dropoff === today && j.dropoff_crew_id) ? j.dropoff_crew_id : j.pickup_crew_id;
        var name = crewId && DATA.crewAll[crewId];
        if(!name) return;
        var t = tally[v.device_id] = tally[v.device_id] || {};
        t[name] = (t[name] || 0) + 1;
      });
      var out = {};
      Object.keys(tally).forEach(function(dev){
        var best = null;
        Object.keys(tally[dev]).forEach(function(n){ if(best === null || tally[dev][n] > tally[dev][best]) best = n; });
        out[dev] = best;
      });
      return out;
    }
    function buildBinBoard(rows, today, notifRows){
      var geo = {dropped:{}, pickedup:{}};
      (notifRows||[]).forEach(function(n){ if(geo[n.status]) geo[n.status][n.job_id]=1; });
      var groups = {}, keys = [];
      function push(crewId, leg){
        var key = crewId || '';
        if(!groups[key]){ groups[key] = {crewId:key, legs:[]}; keys.push(key); }
        groups[key].legs.push(leg);
      }
      rows.forEach(function(j){
        if(j.status==='Cancelled' || j.service!=='Bin Rental') return;
        var picked = !!geo.pickedup[j.job_id];   // geofence-ONLY (Jake 2026-07-07): a leg crosses off from truck-GPS zone visits only, never the job's bin_instatus
        if(j.bin_dropoff===today)
          push(j.dropoff_crew_id, {kind:'drop', time:j.bin_dropoff_time||'', j:j, done: !!(picked || geo.dropped[j.job_id])});
        if(j.bin_pickup===today)
          push(j.pickup_crew_id, {kind:'pick', time:j.bin_pickup_time||'', j:j, done: !!picked});
      });
      var list = keys.map(function(k){ return groups[k]; });
      list.forEach(function(g){
        g.name = g.crewId ? (DATA.crew[g.crewId]||'Unknown') : 'Unassigned';
        g.legs.sort(function(a,b){ return timeMins(a.time)-timeMins(b.time); });
        g.done = g.legs.filter(function(l){ return l.done; }).length;
      });
      // named drivers first (alpha), the unassigned "needs a driver" alert card last
      list.sort(function(a,b){
        if(!a.crewId && b.crewId) return 1;
        if(!b.crewId && a.crewId) return -1;
        return a.name.localeCompare(b.name);
      });
      return list;
    }

    // junk-side work per person per weekday (for schedule ghosts) — same one-way rules as the dashboard
    function buildJunkWeek(rows, monday, satEnd){
      var occ = {};
      function dayName(ds){ return WEEKDAYS[(parseLocal(ds).getDay()+6)%7]; }
      function add(cid, ds, label){
        var nm = cid && DATA.crew[cid];
        if(!nm || !ds || ds<monday || ds>satEnd) return;
        var k = nm.toLowerCase(), dn = dayName(ds);
        occ[k]=occ[k]||{}; occ[k][dn]=occ[k][dn]||{};
        occ[k][dn][label]=(occ[k][dn][label]||0)+1;
      }
      rows.forEach(function(j){
        if(j.status==='Cancelled') return;
        if(j.service==='Bin Rental'){
          add(j.dropoff_crew_id, j.bin_dropoff, 'Bins');
          add(j.pickup_crew_id,  j.bin_pickup,  'Bins');
        } else {
          var lbl = j.service==='Junk Removal' ? 'Junk'
                  : j.service==='Junk Quote' ? 'Quote'
                  : j.service==='Extra Jobs' ? 'Extra Jobs'
                  : String(j.service||'').indexOf('Furniture')===0 ? 'Furniture' : 'Junk';
          var ds = effDay(j);
          (j.assigned_crew_ids||[]).forEach(function(cid){ add(cid, ds, lbl); });
        }
      });
      return occ;
    }

    // ── data load ────────────────────────────────────────────────────────────
    async function loadAll(){
      var today = todayStr(), monday = mondayStr();
      // parseLocal, not new Date(str) — bare 'YYYY-MM-DD' parses as UTC midnight, which
      // in Toronto lands on the PREVIOUS local day and made tomorrow === today.
      var wkEnd = ymd(new Date(parseLocal(monday).getTime()+7*864e5));
      var tomorrow = ymd(new Date(parseLocal(today).getTime()+864e5));
      var satEnd = ymd(new Date(parseLocal(monday).getTime()+5*864e5));   // schedule board shows Mon–Sat
      // Local-midnight bounds for timestamptz columns — a bare 'YYYY-MM-DD' string is
      // read as UTC midnight (8 PM ET the day before), which puts evening events on
      // the wrong day.
      var dayStartIso = parseLocal(today).toISOString();
      var dayEndIso   = new Date(parseLocal(today).getTime()+864e5).toISOString();
      // month windows for the month-vs-last-year tile (count-only queries). jobs.date
      // is the SCHEDULED day, so the current side is cut at today — an uncut current
      // month would include pre-booked future jobs and inflate it. Last year gets TWO
      // cuts, on purpose:
      //   lyCut      — same day-of-month as today. Feeds the % ONLY, so "up or down"
      //                reads day-for-day against where we stood last year.
      //   lyMonthEnd — last year's WHOLE month. The "beat last year" finish line: the
      //                bar tick, the projection and the pace verdict all aim at it.
      var y = +today.slice(0,4), mo = +today.slice(5,7);
      function monthStartStr(yy,mm){ return yy+'-'+String(mm).padStart(2,'0')+'-01'; }
      var moStart = monthStartStr(y, mo);
      var lyStart = monthStartStr(y-1, mo);
      var d0 = parseLocal(today);
      var lyCut = ymd(new Date(d0.getFullYear()-1, d0.getMonth(), d0.getDate()+1));
      var lyMonthEnd = (mo===12) ? monthStartStr(y, 1) : monthStartStr(y-1, mo+1);

      var res = await Promise.all([
        db.from('jobs').select('job_id,service,status,name,business_name,address,city,date,time,junk_date,junk_time,fb_date,fb_time,assigned_crew_ids,dropoff_crew_id,pickup_crew_id,bin_dropoff,bin_dropoff_time,bin_pickup,bin_pickup_time,bin_instatus,bin_size,bin_bid,completed')
          .or('date.eq.'+today+',junk_date.eq.'+today+',fb_date.eq.'+today+',bin_dropoff.eq.'+today+',bin_pickup.eq.'+today),
        // on_junk is no longer filtered server-side: DATA.crew still keeps only the
        // junk crew (below), but the truck-assignment lookup needs to name ANY
        // assigned driver, junk-side or not.
        db.from('crew_members').select('id,name,color,jwg_id,on_junk'),
        db.from('jwg_employees').select('id,name'),
        db.from('jwg_schedules').select('employee_id,schedule_data').eq('week_start', monday),
        db.from('jwg_app_settings').select('key,value').in('key',['tasks','emp_order']),
        db.from('jwg_inventory_items').select('item_name,current_stock,min_threshold,status,unit,category_id'),
        db.from('jwg_inventory_categories').select('id,name,sort_order,is_active'),
        // KPI helpers
        // Bins out now — matches the DASHBOARD's fleet count exactly (Bin Rental,
        // dropped, NOT cancelled). Without the cancelled exclusion the TV over-counts.
        db.from('jobs').select('*',{count:'exact',head:true}).eq('service','Bin Rental').eq('bin_instatus','dropped').neq('status','Cancelled'),
        // jobs this week (Mon–Sun) — NOT counting quotes (a quote isn't a job) or
        // landscaping (the JWG side, not Jeff's Junk).
        db.from('jobs').select('*',{count:'exact',head:true}).gte('date',monday).lt('date',wkEnd).neq('status','Cancelled').neq('service','Junk Quote').neq('service','Extra Jobs'),
        // completed today (hero done/to-go) — same exclusions
        db.from('jobs').select('completed_at').eq('completed',true).gte('completed_at',dayStartIso).lt('completed_at',dayEndIso).neq('service','Junk Quote').neq('service','Extra Jobs'),
        // junk-side work across the schedule week (for the crew-schedule ghosts)
        db.from('jobs').select('service,status,date,junk_date,fb_date,assigned_crew_ids,dropoff_crew_id,pickup_crew_id,bin_dropoff,bin_pickup')
          .or('and(date.gte.'+monday+',date.lte.'+satEnd+'),and(junk_date.gte.'+monday+',junk_date.lte.'+satEnd+'),and(fb_date.gte.'+monday+',fb_date.lte.'+satEnd+'),and(bin_dropoff.gte.'+monday+',bin_dropoff.lte.'+satEnd+'),and(bin_pickup.gte.'+monday+',bin_pickup.lte.'+satEnd+')'),
        // today's geofence enter/leave notifications — done/not-done for the bin board
        db.from('geofence_notifications').select('job_id,status').gte('created_at', dayStartIso),
        // ── "beat last year" per service ── count-only, by scheduled `date`, excluding
        // cancelled. Three cuts each: this month so far (12/14/16), last year's FULL
        // month for the finish line (13/15/17), last year to the SAME day for the %
        // (18/19/20).
        db.from('jobs').select('*',{count:'exact',head:true}).eq('service','Bin Rental').gte('date',moStart).lt('date',tomorrow).neq('status','Cancelled'),
        db.from('jobs').select('*',{count:'exact',head:true}).eq('service','Bin Rental').gte('date',lyStart).lt('date',lyMonthEnd).neq('status','Cancelled'),
        db.from('jobs').select('*',{count:'exact',head:true}).eq('service','Junk Removal').gte('date',moStart).lt('date',tomorrow).neq('status','Cancelled'),
        db.from('jobs').select('*',{count:'exact',head:true}).eq('service','Junk Removal').gte('date',lyStart).lt('date',lyMonthEnd).neq('status','Cancelled'),
        db.from('jobs').select('*',{count:'exact',head:true}).in('service',['Furniture Pickup','Furniture Delivery']).gte('date',moStart).lt('date',tomorrow).neq('status','Cancelled'),
        db.from('jobs').select('*',{count:'exact',head:true}).in('service',['Furniture Pickup','Furniture Delivery']).gte('date',lyStart).lt('date',lyMonthEnd).neq('status','Cancelled'),
        db.from('jobs').select('*',{count:'exact',head:true}).eq('service','Bin Rental').gte('date',lyStart).lt('date',lyCut).neq('status','Cancelled'),
        db.from('jobs').select('*',{count:'exact',head:true}).eq('service','Junk Removal').gte('date',lyStart).lt('date',lyCut).neq('status','Cancelled'),
        db.from('jobs').select('*',{count:'exact',head:true}).in('service',['Furniture Pickup','Furniture Delivery']).gte('date',lyStart).lt('date',lyCut).neq('status','Cancelled'),
